<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge — Aventure</title>
<meta name="description" content="Aventure Devercinge : marche de Nice à Brest.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 20px max(24px, env(safe-area-inset-left));
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }

  .back-link{
    font-size:12px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    text-decoration:none;
  }
  .back-link:hover{ color:var(--ink); }

  .gps-button{
    padding:8px 16px;
    background:var(--green);
    color:var(--bg);
    border:none;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .3s ease, transform .2s ease;
  }
  .gps-button:hover{ opacity:.9; }
  .gps-button:active{ transform:scale(.98); }

  #map{
    width:100%;
    height:100vh;
    position:relative;
    z-index:1;
  }

  .leaflet-container{
    background:var(--bg);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
  }

  .leaflet-popup-content-wrapper{
    background:var(--bg);
    color:var(--ink);
    border:1px solid rgba(155,107,255,.3);
    border-radius:8px;
  }

  .leaflet-popup-close-button{
    color:var(--ink-dim);
  }

  .leaflet-marker-icon{
    filter:drop-shadow(0 0 4px rgba(155,107,255,.5));
  }

  .info-panel{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:5;
    max-width:480px;
    margin:0 auto;
    padding:24px;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    text-align:center;
  }

  .journey-status{
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:12px;
  }

  .journey-status strong{
    color:var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .gps-button{ transition:none; }
  }
</style>
</head>
<body>

  <header>
    <a href="menu.html" class="back-link">← Menu</a>
    <button class="gps-button" id="gpsBtn">📍 Direct</button>
  </header>

  <div id="map"></div>

  <div class="info-panel">
    <div class="journey-status">
      <strong>Nice</strong> → Marseille → Toulouse → Bordeaux → La Rochelle → Nantes → Rennes → Brest<br>
      <span id="journeyDate">Départ : 6 septembre 2024</span>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  const map = L.map('map', { language: 'fr' }).setView([46.2, 0], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    subdomains:'abcd',
    maxZoom:19
  }).addTo(map);

  // Points du trajet
  const waypoints = [
    { lat: 43.7102, lng: 7.2620, name: 'Nice', date: '6 sept 2024' },
    { lat: 43.2965, lng: 5.3698, name: 'Marseille', date: '' },
    { lat: 43.6047, lng: 1.4442, name: 'Toulouse', date: '' },
    { lat: 44.8378, lng: -0.5792, name: 'Bordeaux', date: '' },
    { lat: 46.1591, lng: -1.1578, name: 'La Rochelle', date: '' },
    { lat: 47.2199, lng: -1.5582, name: 'Nantes', date: '' },
    { lat: 48.1173, lng: -1.6778, name: 'Rennes', date: '' },
    { lat: 48.3905, lng: -4.4860, name: 'Brest', date: 'À venir' }
  ];

  // Afficher les points
  waypoints.forEach((point, i) => {
    const isStart = i === 0;
    const isEnd = i === waypoints.length - 1;

    const marker = L.circleMarker([point.lat, point.lng], {
      radius: isStart || isEnd ? 12 : 8,
      fillColor: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#232227'),
      color: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#9d9ba3'),
      weight: 2,
      opacity: 1,
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindPopup(`
      <strong>${point.name}</strong><br>
      ${point.date ? `<small>${point.date}</small>` : '<small>En route...</small>'}
    `);
  });

  // Tracer la ligne du trajet
  const line = L.polyline(
    waypoints.map(p => [p.lat, p.lng]),
    {
      color: '#9b6bff',
      weight: 2,
      opacity: 0.6,
      dashArray: '5, 10'
    }
  ).addTo(map);

  // Bouton GPS (pour plus tard)
  document.getElementById('gpsBtn').addEventListener('click', () => {
    alert('Localisation en temps réel à venir !');
  });
</script>

</body>
</html>
