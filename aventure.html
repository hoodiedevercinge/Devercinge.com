<meta name="twitter:title" content="Devercinge — Mode Aventure">
<meta name="twitter:description" content="Suis l'aventure Devercinge : la marche de Nice à Brest, étape par étape.">
<meta name="twitter:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">

<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 20px max(24px, env(safe-area-inset-left));
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }

  .back-link{
    width:32px;
    flex:0 0 32px;
    display:block;
    line-height:0;
    z-index:11;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
    animation:twinkle 3.5s ease-in-out infinite;
    cursor:pointer;
  }
  .back-link img{
    width:100%;
    height:auto;
    display:block;
  }
  .back-link:hover{ opacity:.8; }

  .gps-button{
    padding:8px 16px;
    background:var(--green);
    color:var(--bg);
    border:none;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .3s ease, transform .2s ease;
  }
  .gps-button:hover{ opacity:.9; }
  .gps-button:active{ transform:scale(.98); }

  #map{
    width:100%;
    height:100vh;
    position:relative;
    z-index:1;
  }

  .leaflet-container{
    background:var(--bg);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
  }

  .leaflet-popup-content-wrapper{
    background:var(--bg);
    color:var(--ink);
    border:1px solid rgba(155,107,255,.3);
    border-radius:8px;
  }

  .leaflet-popup-close-button{
    color:var(--ink-dim);
  }

  .leaflet-marker-icon{
    filter:drop-shadow(0 0 4px rgba(155,107,255,.5));
  }

  @keyframes twinkle{ 0%,100%{opacity:.12;} 50%{opacity:.8;} }

  .info-panel{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:5;
    max-width:480px;
    margin:0 auto;
    padding:24px;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    text-align:center;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:600;
    /* La lettre finale traine son interlettrage : on compense pour recentrer. */
    padding-left:.28em;
    background:linear-gradient(90deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .info-panel .eyebrow{
    line-height:1.7;
    margin-bottom:10px;
  }

  .journey-status{
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:12px;
  }

  /* Ouverture du mode aventure : le trace part de Nice et chaque ville se
     pose quand le trait l'atteint. Le panneau du bas suit une fois arrive. */
  .etape{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  .etape.posee{ animation:etape-posee .5s cubic-bezier(.2,.85,.3,1) forwards; }
  @keyframes etape-posee{
    0%{ opacity:0; transform:scale(.2); }
    60%{ opacity:1; transform:scale(1.3); }
    100%{ opacity:1; transform:scale(1); }
  }

  .info-panel{
    opacity:0;
    transition:opacity .9s ease;
  }
  body.arrive .info-panel{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .gps-button{ transition:none; }
    /* Rien ne se dessine : tout est deja en place au chargement. */
    .etape, .etape.posee{ opacity:1; animation:none; }
    .info-panel{ opacity:1; transition:none; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="back-link">
      <img src="assets/logo-mark.png" alt="Menu">
    </a>
    <button class="gps-button" id="gpsBtn">📍 Direct</button>
  </header>

  <div id="map"></div>

  <div class="info-panel">
    <div class="eyebrow">Mille quatre cent trente-quatre kilomètres</div>
    <div class="journey-status">
      <span id="journeyDate">Départ : 6 septembre 2026</span>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  const map = L.map('map').setView([46.2, 0], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    subdomains:'abcd',
    maxZoom:19
  }).addTo(map);

  // Points du trajet
  const waypoints = [
    { lat: 43.7102, lng: 7.2620, name: 'Nice', date: '6 sept 2026' },
    { lat: 43.2965, lng: 5.3698, name: 'Marseille', date: '' },
    { lat: 43.6047, lng: 1.4442, name: 'Toulouse', date: '' },
    { lat: 44.8378, lng: -0.5792, name: 'Bordeaux', date: '' },
    { lat: 46.1591, lng: -1.1578, name: 'La Rochelle', date: '' },
    { lat: 47.2199, lng: -1.5582, name: 'Nantes', date: '' },
    { lat: 48.1173, lng: -1.6778, name: 'Rennes', date: '' },
    { lat: 48.3905, lng: -4.4860, name: 'Brest', date: 'À venir' }
  ];

  const doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const POINTILLE = '5, 10';

  // Tracer la ligne du trajet. Le temps de l'ouverture elle est pleine : un
  // pointille dont on decale l'offset fait defiler les tirets au lieu de se
  // devoiler. Elle reprend son pointille une fois le trajet pose.
  const line = L.polyline(
    waypoints.map(p => [p.lat, p.lng]),
    {
      color: '#9b6bff',
      weight: 2,
      opacity: 0.6,
      dashArray: doux ? POINTILLE : null
    }
  ).addTo(map);

  // Afficher les points
  const marqueurs = waypoints.map((point, i) => {
    const isStart = i === 0;
    const isEnd = i === waypoints.length - 1;

    const marker = L.circleMarker([point.lat, point.lng], {
      radius: isStart || isEnd ? 12 : 8,
      fillColor: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#232227'),
      color: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#9d9ba3'),
      weight: 2,
      opacity: 1,
      fillOpacity: 0.8,
      className: 'etape'
    }).addTo(map);

    marker.bindPopup(`
      <strong>${point.name}</strong><br>
      ${point.date ? `<small>${point.date}</small>` : '<small>En route...</small>'}
    `);
    return marker;
  });

  const trace = line.getElement();

  if (doux || !trace) {
    poser();
  } else {
    ouvrir();
  }

  function ouvrir(){
    // La longueur se mesure sur le trace projete. Si la carte bouge pendant
    // l'ouverture, Leaflet le redessine et la mesure ne vaut plus rien : on
    // rend la carte inerte jusqu'a Brest.
    const gestes = [map.dragging, map.touchZoom, map.doubleClickZoom,
                    map.scrollWheelZoom, map.tap].filter(Boolean);
    gestes.forEach(g => g.disable());

    const longueur = trace.getTotalLength();
    trace.style.strokeDasharray = longueur;
    trace.style.strokeDashoffset = longueur;

    // Chaque ville se pose quand le trait l'atteint : les distances sont
    // cumulees dans le repere projete, celui-la meme du trace.
    const pts = waypoints.map(p => map.latLngToLayerPoint([p.lat, p.lng]));
    const cumul = [0];
    for (let i = 1; i < pts.length; i++) {
      cumul.push(cumul[i - 1] + pts[i].distanceTo(pts[i - 1]));
    }
    const totale = cumul[cumul.length - 1] || 1;
    const seuils = cumul.map(d => d / totale);

    const DUREE = 2800;
    const lisse = x => x * x * (3 - 2 * x);
    let debut = null;

    requestAnimationFrame(function marcher(t){
      if (debut === null) debut = t;
      const brut = Math.min(1, (t - debut) / DUREE);
      const p = lisse(brut);
      trace.style.strokeDashoffset = longueur * (1 - p);
      seuils.forEach((s, i) => {
        if (p >= s) {
          const el = marqueurs[i].getElement();
          if (el) el.classList.add('posee');
        }
      });
      if (brut < 1) requestAnimationFrame(marcher);
      else {
        gestes.forEach(g => g.enable());
        poser();
      }
    });
  }

  function poser(){
    if (trace) {
      trace.style.strokeDasharray = POINTILLE;
      trace.style.strokeDashoffset = 0;
    }
    marqueurs.forEach(m => {
      const el = m.getElement();
      if (el) el.classList.add('posee');
    });
    document.body.classList.add('arrive');
  }

  // Bouton GPS (pour plus tard)
  document.getElementById('gpsBtn').addEventListener('click', () => {
    alert('Localisation en temps réel à venir !');
  });
</script>

</body>
</html>
