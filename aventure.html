<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge — Mode Aventure</title>
<meta name="description" content="Aventure Devercinge : marche de Nice à Saint-Malo.">
<meta name="theme-color" content="#0a0a0c">
<link rel="canonical" href="https://hoodiedevercinge.github.io/Devercinge.com/aventure.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Devercinge">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://hoodiedevercinge.github.io/Devercinge.com/aventure.html">
<meta property="og:title" content="Devercinge — Mode Aventure">
<meta property="og:description" content="Suis l'aventure Devercinge : la marche de Nice à Saint-Malo, étape par étape.">
<meta property="og:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Devercinge — Mode Aventure">
<meta name="twitter:description" content="Suis l'aventure Devercinge : la marche de Nice à Saint-Malo, étape par étape.">
<meta name="twitter:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 20px max(24px, env(safe-area-inset-left));
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }

  .back-link{
    width:32px;
    flex:0 0 32px;
    display:block;
    line-height:0;
    z-index:11;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
    animation:twinkle 3.5s ease-in-out infinite;
    cursor:pointer;
  }
  .back-link img{
    width:100%;
    height:auto;
    display:block;
  }
  .back-link:hover{ opacity:.8; }

  .gps-button{
    padding:8px 16px;
    background:var(--green);
    color:var(--bg);
    border:none;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .3s ease, transform .2s ease;
  }
  .gps-button:hover{ opacity:.9; }
  .gps-button:active{ transform:scale(.98); }

  #map{
    width:100%;
    height:100vh;
    position:relative;
    z-index:1;
  }

  .leaflet-container{
    background:var(--bg);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
  }

  .leaflet-popup-content-wrapper{
    background:var(--bg);
    color:var(--ink);
    border:1px solid rgba(155,107,255,.3);
    border-radius:8px;
  }

  .leaflet-popup-close-button{
    color:var(--ink-dim);
  }

  .leaflet-marker-icon{
    filter:drop-shadow(0 0 4px rgba(155,107,255,.5));
  }

  @keyframes twinkle{ 0%,100%{opacity:.12;} 50%{opacity:.8;} }

  .info-panel{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:5;
    max-width:480px;
    margin:0 auto;
    padding:24px;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    text-align:center;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:600;
    /* La lettre finale traine son interlettrage : on compense pour recentrer. */
    padding-left:.28em;
    background:linear-gradient(90deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .info-panel .eyebrow{
    line-height:1.7;
    margin-bottom:10px;
  }

  .journey-status{
    font-size:13px;
    color:var(--ink);
    letter-spacing:.06em;
    margin-bottom:4px;
  }

  /* Le point de depart en coordonnees. La distance est deja dite en toutes
     lettres juste au-dessus, la redire en chiffres ferait doublon. */
  .coordonnees{
    font-size:12px;
    letter-spacing:.16em;
    color:var(--ink-dim);
    margin-bottom:14px;
    font-variant-numeric:tabular-nums;
  }

  .depart{
    font-size:12px;
    color:var(--ink-dim);
    opacity:.75;
    margin-bottom:10px;
  }

  /* Ouverture du mode aventure : le trace part de Nice et chaque ville se
     pose quand le trait l'atteint. Le panneau du bas suit une fois arrive. */
  .etape{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  .etape.posee{ animation:etape-posee .5s cubic-bezier(.2,.85,.3,1) forwards; }
  @keyframes etape-posee{
    0%{ opacity:0; transform:scale(.2); }
    60%{ opacity:1; transform:scale(1.3); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* Le nom de la ville, pose en meme temps que son point. Leaflet dessine
     ses infobulles en cartouche blanc a fleche : on remet tout a plat, le
     nom se lit sur la carte sans boite. */
  .nom-ville{
    background:none;
    border:none;
    box-shadow:none;
    padding:0;
    color:var(--ink);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    /* Le fond de carte est sombre mais pas uniforme : une ombre portee
       tient le nom lisible au-dessus des routes et des reliefs. */
    text-shadow:0 0 4px rgba(10,10,12,1), 0 0 10px rgba(10,10,12,.9);
    white-space:nowrap;
  }
  /* Deux classes pour passer devant la fleche de Leaflet, qui en compte une. */
  .leaflet-tooltip.nom-ville::before{ display:none; }
  .nom-texte{
    display:inline-block;
    opacity:0;
    /* Sert a l'effacement quand on quitte la ville ; l'arrivee, elle, se
       joue lettre par lettre. */
    transition:opacity .4s ease;
  }
  .nom-ville.posee .nom-texte{ opacity:1; transition:none; }
  .nom-texte i{ display:inline-block; font-style:normal; }
  /* « backwards » tient la lettre invisible pendant son retard, et la laisse
     a son etat normal une fois finie : elle reste donc visible pour le fondu
     de sortie du bloc. */
  .nom-ville.posee .nom-texte i{
    animation:lettre-decouverte .28s cubic-bezier(.2,.8,.3,1) backwards;
    animation-delay:var(--retard, 0s);
  }
  @keyframes lettre-decouverte{
    from{ opacity:0; transform:translateY(7px); filter:blur(4px); }
    to{ opacity:1; transform:translateY(0); filter:blur(0); }
  }

  .info-panel{
    opacity:0;
    transition:opacity .9s ease;
  }
  body.arrive .info-panel{ opacity:1; }

  /* L'attribution du fond de carte, obligatoire, posee dans notre pied de
     page plutot que dans le controle de Leaflet, que le panneau recouvrait. */
  .credit{
    font-size:10px;
    letter-spacing:.04em;
    color:var(--ink-dim);
    opacity:.7;
  }
  .credit a{ color:inherit; }

  @media (prefers-reduced-motion: reduce){
    .gps-button{ transition:none; }
    /* Rien ne se dessine : tout est deja en place au chargement. */
    .etape, .etape.posee{ opacity:1; animation:none; }
    .nom-texte{ transition:none; }
    .nom-ville.posee .nom-texte i{ animation:none; }
    .info-panel{ opacity:1; transition:none; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="back-link">
      <img src="assets/logo-mark.png" alt="Menu">
    </a>
    <button class="gps-button" id="gpsBtn">📍 Direct</button>
  </header>

  <div id="map"></div>

  <div class="info-panel">
    <div class="eyebrow">Mille quatre cent huit kilomètres</div>
    <div class="coordonnees" id="coordonnees"></div>
    <div class="journey-status">Nice → Saint-Malo</div>
    <div class="depart">Départ : 6 septembre 2026</div>
    <div class="credit">Fond de carte
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  // zoomSnap:0 : le survol a besoin de zooms fractionnaires, sinon la camera
  // avance par paliers d'un cran entier et saccade.
  //
  // attributionControl:false : le controle de Leaflet se posait en bas a
  // droite, sous le panneau du bas qui le recouvrait entierement -- il ne
  // remplissait donc plus son role. L'attribution est reprise a la main dans
  // le pied de page, ou elle se lit et se clique vraiment. Le logo et le nom
  // de Leaflet, eux, ne sont qu'une courtoisie et disparaissent au passage.
  const map = L.map('map', { zoomSnap: 0, attributionControl: false })
               .setView([46.2, 0], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd',
    maxZoom:19
  }).addTo(map);

  // Points du trajet. « cote » place le nom : voir DECALAGES plus bas.
  const waypoints = [
    { lat: 43.7102, lng: 7.2620, name: 'Nice', date: '6 sept 2026', cote: 'top' },
    { lat: 43.2965, lng: 5.3698, name: 'Marseille', date: '', cote: 'bottom' },
    { lat: 43.6108, lng: 3.8767, name: 'Montpellier', date: '', cote: 'top' },
    { lat: 43.1836, lng: 3.0036, name: 'Narbonne', date: '', cote: 'bottom' },
    { lat: 43.6047, lng: 1.4442, name: 'Toulouse', date: '', cote: 'top' },
    { lat: 44.8378, lng: -0.5792, name: 'Bordeaux', date: '', cote: 'left' },
    { lat: 46.1591, lng: -1.1578, name: 'La Rochelle', date: '', cote: 'left' },
    { lat: 47.2199, lng: -1.5582, name: 'Nantes', date: '', cote: 'bottom' },
    { lat: 47.4784, lng: -0.5632, name: 'Angers', date: '', cote: 'right' },
    { lat: 48.1173, lng: -1.6778, name: 'Rennes', date: '', cote: 'right' },
    { lat: 48.6493, lng: -2.0257, name: 'Saint-Malo', date: 'Arrivée', cote: 'top' }
  ];

  // De quoi degager le nom du disque, dont le rayon monte a 12 px.
  const DECALAGES = {
    right:  L.point(16, 0),
    left:   L.point(-16, 0),
    top:    L.point(0, -16),
    bottom: L.point(0, 16)
  };
  // Le nom se decouvre lettre a lettre. Le retard est une fraction du nom et
  // non un pas fixe : « Nice » et « La Rochelle » mettent ainsi le meme temps
  // a se lire, et la revelation tient dans l'arret sur la ville quelle que
  // soit la longueur du mot.
  const CASCADE = 0.15;  // secondes entre la premiere lettre et la derniere
  function enLettres(nom){
    const n = Math.max(1, nom.length - 1);
    return [...nom].map((c, k) => c === ' ' ? ' '
      : `<i style="--retard:${(k / n * CASCADE).toFixed(3)}s">${c}</i>`).join('');
  }

  const doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const POINTILLE = '5, 10';

  // Tracer la ligne du trajet. Le temps de l'ouverture elle est pleine : un
  // pointille dont on decale l'offset fait defiler les tirets au lieu de se
  // devoiler. Elle reprend son pointille une fois le trajet pose.
  //
  // noClip : par defaut Leaflet rogne la polyligne sur la zone visible. Des
  // que la camera descend sur une etape, le trace ne contiendrait plus que le
  // morceau a l'ecran et sa longueur mesuree n'aurait plus rien a voir avec
  // celle de la route.
  const line = L.polyline(
    waypoints.map(p => [p.lat, p.lng]),
    {
      color: '#9b6bff',
      weight: 2,
      opacity: 0.6,
      dashArray: doux ? POINTILLE : null,
      noClip: true
    }
  ).addTo(map);

  // Afficher les points
  const marqueurs = waypoints.map((point, i) => {
    const isStart = i === 0;
    const isEnd = i === waypoints.length - 1;

    const marker = L.circleMarker([point.lat, point.lng], {
      radius: isStart || isEnd ? 12 : 8,
      fillColor: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#232227'),
      color: isStart ? '#3ddc84' : (isEnd ? '#9b6bff' : '#9d9ba3'),
      weight: 2,
      opacity: 1,
      fillOpacity: 0.8,
      className: 'etape'
    }).addTo(map);

    // Le nom, pose en meme temps que le point. Le cote est choisi ville par
    // ville : une fois la carte revenue au trajet entier, le sud est serre
    // et des etiquettes toutes du meme cote se chevaucheraient.
    // Leaflet pose une opacite en style inline sur ses infobulles, ce qui
    // bat la feuille de style : on la lui demande pleine et c'est un span
    // interieur qu'on fait apparaitre.
    marker.bindTooltip('<span class="nom-texte"></span>', {
      permanent: true,
      direction: point.cote,
      offset: DECALAGES[point.cote],
      className: 'nom-ville',
      opacity: 1
    });
    marker.getTooltip().getElement()
          .querySelector('.nom-texte').innerHTML = enLettres(point.name);

    marker.bindPopup(`
      <strong>${point.name}</strong><br>
      ${point.date ? `<small>${point.date}</small>` : '<small>En route...</small>'}
    `);
    return marker;
  });

  function nomDe(marqueur){
    const t = marqueur.getTooltip();
    return t ? t.getElement() : null;
  }

  // Les deux seules villes nommees une fois la carte au repos.
  const bornes = i => i === 0 || i === waypoints.length - 1;


  // Le depart, ecrit depuis les donnees du trajet : une coordonnee recopiee
  // a la main finirait par mentir le jour ou le point bouge.
  (function ecrireDepart(){
    const d = waypoints[0];
    const tour = (v, pos, neg) =>
      Math.abs(v).toFixed(4) + '° ' + (v >= 0 ? pos : neg);
    document.getElementById('coordonnees').textContent =
      tour(d.lat, 'N', 'S') + ' · ' + tour(d.lng, 'E', 'O');
  })();

  const trace = line.getElement();

  // Vue de repos : le trajet entier, cadre par la carte plutot qu'a la main.
  //
  // Le cadrage se calcule sur les points, mais ce sont les noms qui touchent
  // les bords. « Saint-Malo » se pose au-dessus de son point a l'extremite
  // ouest et deborde de part et d'autre, la ou « Nice » est court a l'autre
  // bout : le bloc penche a gauche. Plutot que d'elargir le cadre, ce qui
  // rapetisserait le trajet, on decale la vue de quelques pixels pour
  // egaliser les deux marges.
  const etendue = L.latLngBounds(waypoints.map(p => [p.lat, p.lng]));
  const DEPORT = 14;   // pixels, mesures a l'ecran
  const zoomLarge = map.getBoundsZoom(etendue, false, L.point(110, 90));
  const VUE_LARGE = {
    centre: map.unproject(
      map.project(etendue.getCenter(), zoomLarge).subtract(L.point(DEPORT, 0)),
      zoomLarge),
    zoom: zoomLarge
  };

  if (doux || !trace) {
    map.setView(VUE_LARGE.centre, VUE_LARGE.zoom, { animate: false });
    poser();
  } else {
    ouvrir();
  }

  function ouvrir(){
    const gestes = [map.dragging, map.touchZoom, map.doubleClickZoom,
                    map.scrollWheelZoom, map.tap].filter(Boolean);
    gestes.forEach(g => g.disable());

    // Les distances sont cumulees dans un repere projete fixe : changer de
    // zoom multiplie toutes les coordonnees par un meme facteur, donc les
    // proportions ne bougent pas et ces seuils restent valables partout.
    const ZREF = 8;
    const pts = waypoints.map(p => map.project([p.lat, p.lng], ZREF));
    const cumul = [0];
    for (let i = 1; i < pts.length; i++) {
      cumul.push(cumul[i - 1] + pts[i].distanceTo(pts[i - 1]));
    }
    const totale = cumul[cumul.length - 1] || 1;
    const seuils = cumul.map(d => d / totale);

    // Un zoom de survol par etape : une etape courte se regarde de plus pres
    // qu'une longue.
    const zSurvol = pts.slice(0, -1).map((_, i) => map.getBoundsZoom(
      L.latLngBounds([waypoints[i].lat, waypoints[i].lng],
                     [waypoints[i + 1].lat, waypoints[i + 1].lng]),
      false, L.point(60, 110)) - 0.5);

    // La progression est la seule verite : la longueur du trace change chaque
    // fois que Leaflet le redessine, on la relit donc a chaque image.
    //
    // Les disques restent une fois poses, ils dessinent la route. Les noms,
    // eux, se relaient : pendant le survol on est au ras du sol et un seul
    // nom a la fois se lit, celui de la ville qu'on vient d'atteindre.
    // « finale » passe a la lecture de repos, ou seuls le depart et le
    // terminus sont nommes ; les etapes du milieu n'existent que le temps
    // du survol, la carte large reste ainsi lisible.
    function avancer(p, finale){
      const L2 = trace.getTotalLength();
      trace.style.strokeDasharray = L2;
      trace.style.strokeDashoffset = L2 * (1 - p);
      let courant = -1;
      for (let i = 0; i < seuils.length; i++) if (p >= seuils[i]) courant = i;
      for (let i = 0; i < seuils.length; i++) {
        if (p >= seuils[i]) {
          const el = marqueurs[i].getElement();
          if (el) el.classList.add('posee');
        }
        const nom = nomDe(marqueurs[i]);
        if (nom) nom.classList.toggle('posee', finale ? bornes(i) : i === courant);
      }
    }

    function cadrer(centre, zoom){ map.setView(centre, zoom, { animate: false }); }

    function melange(a, b, t){
      const pa = map.project(a, ZREF), pb = map.project(b, ZREF);
      return map.unproject(pa.add(pb.subtract(pa).multiplyBy(t)), ZREF);
    }

    // Le drone se pose sur chaque ville, le temps qu'on lise son nom, puis
    // reprend de l'altitude pour rejoindre la suivante et redescendre dessus.
    const DESCENTE = 500, ARRET = 480, TRAJET = 280, REMONTEE = 750;
    const RECUL = 0.9;    // hauteur reprise entre deux villes
    const lisse = x => x * x * (3 - 2 * x);

    const villes = waypoints.map((w, i) => map.unproject(pts[i], ZREF));
    // Au-dessus d'une ville on est plus bas qu'en chemin : c'est l'arret qui
    // porte le regard, le trajet ne sert qu'a relier.
    const zVille = waypoints.map((_, i) =>
      zSurvol[Math.min(i, zSurvol.length - 1)] + RECUL);

    // Le plan de vol, dresse une fois : chaque temps sait quand il commence.
    const plan = [];
    let curseur = 0;
    const poser_temps = (type, duree, i) => {
      plan.push({ type, debut: curseur, duree, i });
      curseur += duree;
    };
    poser_temps('descente', DESCENTE);
    for (let i = 0; i < waypoints.length; i++) {
      poser_temps('arret', ARRET, i);
      if (i < waypoints.length - 1) poser_temps('trajet', TRAJET, i);
    }
    poser_temps('remontee', REMONTEE);
    const TOTAL = curseur;

    let t0 = null, fini = false;

    // Une pression sur la carte coupe court : l'ouverture dure ce qu'elle
    // dure, ce n'est pas a l'ecran de decider quand on peut enfin toucher.
    map.getContainer().addEventListener('pointerdown', sauter, { once: true });

    avancer(0);
    cadrer(VUE_LARGE.centre, VUE_LARGE.zoom);

    requestAnimationFrame(function image(t){
      if (fini) return;
      if (t0 === null) t0 = t;
      const dt = t - t0;
      if (dt >= TOTAL) { sauter(); return; }

      const temps = plan.find(e => dt < e.debut + e.duree) || plan[plan.length - 1];
      const u = (dt - temps.debut) / temps.duree;
      const k = lisse(Math.min(1, Math.max(0, u)));
      const i = temps.i;
      const dernier = waypoints.length - 1;

      if (temps.type === 'descente') {
        cadrer(melange(VUE_LARGE.centre, villes[0], k),
               VUE_LARGE.zoom + (zVille[0] - VUE_LARGE.zoom) * k);
      } else if (temps.type === 'arret') {
        // Camera immobile : le nom se decouvre, rien d'autre ne bouge.
        cadrer(villes[i], zVille[i]);
        avancer(seuils[i]);
      } else if (temps.type === 'trajet') {
        cadrer(melange(villes[i], villes[i + 1], k),
               zVille[i] + (zVille[i + 1] - zVille[i]) * k
                         - RECUL * Math.sin(Math.PI * k));
        avancer(seuils[i] + (seuils[i + 1] - seuils[i]) * k);
      } else {
        // Saint-Malo garde son moment a lui : Nice ne revient qu'une fois
        // la camera partie vers le haut.
        avancer(1, k > 0.35);
        cadrer(melange(villes[dernier], VUE_LARGE.centre, k),
               zVille[dernier] + (VUE_LARGE.zoom - zVille[dernier]) * k);
      }
      requestAnimationFrame(image);
    });

    function sauter(){
      if (fini) return;
      fini = true;
      map.getContainer().removeEventListener('pointerdown', sauter);
      cadrer(VUE_LARGE.centre, VUE_LARGE.zoom);
      gestes.forEach(g => g.enable());
      poser();
    }
  }

  function poser(){
    if (trace) {
      trace.style.strokeDasharray = POINTILLE;
      trace.style.strokeDashoffset = 0;
    }
    marqueurs.forEach((m, i) => {
      const el = m.getElement();
      if (el) el.classList.add('posee');
      const nom = nomDe(m);
      if (nom) nom.classList.toggle('posee', bornes(i));
    });
    document.body.classList.add('arrive');
  }

  // Bouton GPS (pour plus tard)
  document.getElementById('gpsBtn').addEventListener('click', () => {
    alert('Localisation en temps réel à venir !');
  });
</script>

</body>
