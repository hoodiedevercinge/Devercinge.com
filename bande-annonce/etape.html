<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Devercinge — étape validée</title>
<style>
  :root{ --bg:#0a0a0c; --ink:#f2f1ef; --dim:#9d9ba3; --sourd:#4a4a52;
         --violet:#9b6bff; --green:#3ddc84; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
  body{ position:relative; font-family:'Liberation Sans','DejaVu Sans',sans-serif; color:var(--ink); }

  #stars{ position:absolute; inset:0; }
  #stars span{ position:absolute; background:var(--ink); border-radius:50%; }

  .layer{ position:absolute; inset:0; }

  .eyebrow{
    position:absolute; left:0; right:0; text-align:center;
    font-size:34px; font-weight:700; letter-spacing:.34em;
    text-transform:uppercase; padding-left:.34em; line-height:1.7;
    background:linear-gradient(90deg,var(--violet),var(--green));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  #logo{ position:absolute; left:50%; top:230px; width:190px;
         transform:translate(-50%,-50%);
         filter:drop-shadow(0 0 50px rgba(155,107,255,.35)); }

  #titre{ top:350px; }
  #logo3{ position:absolute; left:50%; top:430px; width:160px;
          transform:translate(-50%,-50%);
          filter:drop-shadow(0 0 40px rgba(155,107,255,.3)); }
  #logo2{ position:absolute; left:50%; top:840px; width:300px;
          transform:translate(-50%,-50%); }
  #fin{ top:1060px; }
  #url{ top:1220px; }

  /* ---- la carte : ce qui est fait en vert, ce qui reste en gris ---- */
  #carte{ position:absolute; inset:0; }
  #fantome{ fill:none; stroke:#2b2b33; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  #fait{ fill:none; stroke:var(--green); stroke-width:7; stroke-linecap:round;
         stroke-linejoin:round; filter:url(#lueur); }
  .pt{ fill:#16161b; stroke:var(--sourd); stroke-width:4; }
  .pt.validee{ fill:var(--green); stroke:none; }
  .anneau{ fill:none; stroke:var(--green); stroke-width:3; opacity:0; }
  .pt.but{ fill:none; stroke:var(--violet); stroke-width:5; }
  .coche{ fill:none; stroke:#0a0a0c; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  .nom{ fill:var(--ink); font-size:38px; font-weight:700; letter-spacing:.14em;
        text-transform:uppercase; }
  .nom.but{ fill:var(--dim); font-size:32px; }

  /* ---- le monument de l'etape ---- */
  #scene2 svg{ position:absolute; left:50%; top:880px; transform:translate(-50%,-50%); }
  .trait{ fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  #ville{
    position:absolute; left:0; right:0; top:1230px; text-align:center;
    font-size:72px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    padding-left:.1em;
  }
  #compte{
    position:absolute; left:0; right:0; top:1400px; text-align:center;
    font-size:40px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    padding-left:.2em;
    background:linear-gradient(90deg,var(--violet),var(--green));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  #km{
    position:absolute; left:0; right:0; top:1492px; text-align:center;
    font-size:32px; letter-spacing:.18em; text-transform:uppercase;
    color:#b5b3bb; padding-left:.18em;
  }

  /* La vitrine de fin : les cinq pieces, comme dans la boutique --
     une fenetre en degrade derriere, le vetement pose par-dessus. */
  #vitrine{ position:absolute; left:50%; top:820px; width:1000px;
            transform:translateX(-50%); height:420px; }
  .piece{ position:absolute; bottom:0; width:var(--pas,200px); text-align:center; }
  .piece .fenetre{
    position:absolute; left:50%; bottom:0; width:104px; height:330px;
    transform:translateX(-50%); transform-origin:bottom center;
    background:
      radial-gradient(circle at 24% 16%, rgba(155,107,255,.34), transparent 60%),
      radial-gradient(circle at 80% 84%, rgba(61,220,132,.26), transparent 60%);
    background-size:1000px 330px; background-repeat:no-repeat;
  }
  .piece img{
    position:relative; display:block; margin:0 auto;
    width:186px; height:330px; object-fit:contain;
    filter:drop-shadow(0 12px 28px rgba(155,107,255,.25));
  }
  #collection{
    position:absolute; left:0; right:0; top:1340px; text-align:center;
    font-size:40px; font-weight:700; letter-spacing:.3em;
    text-transform:uppercase; padding-left:.3em;
    background:linear-gradient(90deg,var(--violet),var(--green));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* La page du reste a parcourir : meme ecriture et meme degrade
     violet-vert que « trois villes sur onze ». */
  .reste{
    position:absolute; left:0; right:0; text-align:center;
    font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    padding-left:.2em;
    background:linear-gradient(90deg,var(--violet),var(--green));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  #reste-titre{ top:800px; font-size:40px; }
  #reste-nb{ top:900px; font-size:46px; letter-spacing:.14em; padding-left:.14em; line-height:1.55; }

  /* L'augmentation depuis la derniere etape : meme degrade que « trois villes
     sur onze », plus grande que les kilometres parcourus pour qu'on la lise
     comme une progression. Absente (et sans effet) quand l'etape n'en a pas. */
  #plus, #depuis{ display:none; position:absolute; left:0; right:0; text-align:center;
                  text-transform:uppercase; }
  .avec-plus #plus, .avec-plus #depuis{ display:block; }
  #plus{
    top:1585px; font-size:44px; font-weight:700; letter-spacing:.14em; padding-left:.14em;
    background:linear-gradient(90deg,var(--violet),var(--green));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  #depuis{ top:1655px; font-size:28px; letter-spacing:.2em; padding-left:.2em; color:var(--dim); }

  #url{
    position:absolute; left:0; right:0; text-align:center;
    font-size:34px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--dim); padding-left:.3em;
  }

  /* ====================== PAYSAGE (page ouverte avec ?paysage) ======================
     1920x1080 : la carte passe a droite et les textes a gauche, les scenes qui
     empilaient un monument et trois lignes les posent cote a cote. Le portrait
     n'est pas touche : tout ce qui suit est une surcharge. */
  .paysage, .paysage body{ width:1920px; height:1080px; }

  .paysage #logo{ left:480px; top:410px; width:230px; }
  .paysage #titre{ right:auto; width:960px; top:590px; }

  .paysage #scene2 svg{ left:480px; top:540px; }
  .paysage #ville, .paysage #compte, .paysage #km, .paysage #plus, .paysage #depuis{ left:960px; }
  .paysage #plus{ top:725px; font-size:42px; }
  .paysage #depuis{ top:792px; font-size:26px; }
  .paysage #ville{ top:380px; font-size:84px; }
  .paysage #compte{ top:545px; font-size:42px; }
  .paysage #km{ top:630px; font-size:32px; }

  .paysage #reste-titre{ top:395px; font-size:52px; }
  .paysage #reste-nb{ top:505px; font-size:70px; }

  .paysage #logo3{ top:230px; width:130px; }
  .paysage #vitrine{ --pas:270px; top:390px; width:1350px; height:440px; }
  .paysage .piece .fenetre{ width:140px; height:380px; background-size:1350px 380px; }
  .paysage .piece img{ width:250px; height:380px; }
  .paysage #collection{ top:890px; font-size:44px; }

  .paysage #logo2{ top:440px; width:240px; }
  .paysage #fin{ top:680px; font-size:40px; }
  .paysage #url{ top:820px; font-size:38px; }
</style>

<div id="stars"></div>

<div class="layer" id="entete">
  <img id="logo" src="../assets/logo-mark.png" alt="">

</div>

<div class="layer" id="scene1">

</div>

</div>

<!-- Une etape par entree. La page affiche celle que demande ?etape=nom
     (montpellier par defaut). Pour une nouvelle etape, ajouter une entree :
       atteinte  indice de la derniere VILLE DU TRACE franchie (0 = Nice)
       km        kilometres parcourus -- a remplacer par le releve GPS
       km_avant  (facultatif) km de l'etape precedente : affiche l'augmentation
       depuis    (avec km_avant) nom de l'etape precedente
       plus_loin (facultatif) quand l'etape n'est pas l'une des onze villes :
                 une LISTE de points {nom, lat, lng}, dans l'ordre du parcours,
                 apres la ville `atteinte`. Le dernier est l'etape du jour (il a
                 son monument dans monuments.js, MONUMENTS_ETAPES) ; les autres
                 sont les etapes deja faites, que le trait vert doit traverser
                 -->
<script type="application/json" id="etapes">
{
  "montpellier": { "atteinte": 2, "km": 322 },
  "meze": { "atteinte": 2, "km": 356, "km_avant": 322, "depuis": "Montpellier",
            "plus_loin": [ { "nom": "Mèze", "lat": 43.4255, "lng": 3.6045 } ] },

  "beziers": { "atteinte": 2, "km": 393, "km_avant": 356, "depuis": "Mèze",
               "plus_loin": [ { "nom": "Mèze", "lat": 43.4255, "lng": 3.6045 },
                              { "nom": "Béziers", "lat": 43.3412, "lng": 3.2140 } ] },

  "argeliers": { "atteinte": 2, "km": 421, "km_avant": 393, "depuis": "Béziers",
                 "plus_loin": [ { "nom": "Mèze", "lat": 43.4255, "lng": 3.6045 },
                                { "nom": "Béziers", "lat": 43.3412, "lng": 3.2140 },
                                { "nom": "Argeliers", "lat": 43.3122, "lng": 2.9105 } ] },

  "la-redorte": { "atteinte": 2, "km": 447, "km_avant": 421, "depuis": "Argeliers",
                  "plus_loin": [ { "nom": "Mèze", "lat": 43.4255, "lng": 3.6045 },
                                 { "nom": "Béziers", "lat": 43.3412, "lng": 3.2140 },
                                 { "nom": "Argeliers", "lat": 43.3122, "lng": 2.9105 },
                                 { "nom": "La Redorte", "lat": 43.2539, "lng": 2.6350 } ] }
}
</script>

<script src="monuments.js"></script>
<script>
const ETAPES = JSON.parse(document.getElementById('etapes').textContent);
const NOM_ETAPE = (location.search.match(/[?&]etape=([a-z0-9-]+)/) || [])[1] || 'montpellier';
const E = ETAPES[NOM_ETAPE];
if (!E) throw new Error('etape inconnue : ' + NOM_ETAPE);
const ATTEINTE = E.atteinte;
const KM_FAITS = E.km;
const KM_TOTAL = 1408;            // longueur du parcours ; le reste s'en deduit
const PLUS_LOIN = E.plus_loin ? [].concat(E.plus_loin) : [];    // une liste ; un objet seul est accepte
const DU_JOUR = PLUS_LOIN.length ? PLUS_LOIN[PLUS_LOIN.length-1] : null;   // l'etape du jour

// Portrait par defaut ; ?paysage pour la version 1920x1080.
const PAYSAGE = /[?&]paysage/.test(location.search);
document.documentElement.classList.toggle('paysage', PAYSAGE);
const W = PAYSAGE ? 1920 : 1080, H = PAYSAGE ? 1080 : 1920;
document.getElementById('carte').setAttribute('viewBox', '0 0 ' + W + ' ' + H);

const lisse = x => x<0?0 : x>1?1 : x*x*(3-2*x);
const seg = (t,a,b) => lisse((t-a)/(b-a));
const fen = (t,a,b,c,d) => Math.min(seg(t,a,b), 1-seg(t,c,d));

function graine(s){ return function(){ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; }
const alea = graine(20260906);

const ciel = document.getElementById('stars');
const etoiles = [];
for (let i=0;i<150;i++){
  const s=document.createElement('span'); const d=2+alea()*4;
  s.style.left=(alea()*W)+'px'; s.style.top=(alea()*H)+'px';
  s.style.width=d+'px'; s.style.height=d+'px';
  ciel.appendChild(s);
  etoiles.push({el:s, base:.25+alea()*.5, vitesse:.6+alea()*1.4, phase:alea()*6.28});
}

// Coordonnees reprises telles quelles d'aventure.html.
const VILLES = [
  { lat:43.7102, lng: 7.2620, nom:'Nice' },
  { lat:43.2965, lng: 5.3698, nom:'Marseille' },
  { lat:43.6108, lng: 3.8767, nom:'Montpellier' },
  { lat:43.1836, lng: 3.0036, nom:'Narbonne' },
  { lat:43.6047, lng: 1.4442, nom:'Toulouse' },
  { lat:44.8378, lng:-0.5792, nom:'Bordeaux' },
  { lat:46.1591, lng:-1.1578, nom:'La Rochelle' },
  { lat:47.2199, lng:-1.5582, nom:'Nantes' },
  { lat:47.4784, lng:-0.5632, nom:'Angers' },
  { lat:48.1173, lng:-1.6778, nom:'Rennes' },
  { lat:48.6493, lng:-2.0257, nom:'Saint-Malo' }
];

const CADRE = PAYSAGE ? { x:960, y:150, w:900, h:830 } : { x:120, y:600, w:840, h:1050 };
const merc = lat => Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
const bx = VILLES.map(v => v.lng*Math.PI/180), by = VILLES.map(v => merc(v.lat));
const x0=Math.min(...bx), x1=Math.max(...bx), y0=Math.min(...by), y1=Math.max(...by);
const ech = Math.min(CADRE.w/(x1-x0), CADRE.h/(y1-y0));
const dx = CADRE.x + (CADRE.w - (x1-x0)*ech)/2, dy = CADRE.y + (CADRE.h - (y1-y0)*ech)/2;
const P = VILLES.map((v,i) => [dx + (bx[i]-x0)*ech, dy + (y1-by[i])*ech]);
const d = (a,b) => (b?'L ':'M ') + a[0].toFixed(1) + ' ' + a[1].toFixed(1);

// L'etape hors trace est projetee comme les villes : meme echelle, meme origine.
const PMS = PLUS_LOIN.map(q => [dx + (q.lng*Math.PI/180 - x0)*ech, dy + (y1 - merc(q.lat))*ech]);
const PM = PMS.length ? PMS[PMS.length-1] : null;                   // l'etape du jour
const PTS_FAITS = P.slice(0, ATTEINTE+1).concat(PMS);               // ce que le trait vert parcourt
const DERNIER = PTS_FAITS.length - 1;

document.getElementById('fantome').setAttribute('d', P.map((p,i)=>d(p,i)).join(' '));
const fait = document.getElementById('fait');
fait.setAttribute('d', PTS_FAITS.map((p,i)=>d(p,i)).join(' '));
const LFAIT = fait.getTotalLength();
fait.style.strokeDasharray = LFAIT;

// Longueur cumulee le long de la portion faite, pour allumer chaque ville
// au moment ou le trait l'atteint vraiment.
const CUM = [0];
for (let i=1;i<=DERNIER;i++)
  CUM.push(CUM[i-1] + Math.hypot(PTS_FAITS[i][0]-PTS_FAITS[i-1][0], PTS_FAITS[i][1]-PTS_FAITS[i-1][1]));

const gPts = document.getElementById('pts'), gNoms = document.getElementById('noms');
const pastilles = [], coches = [];
// `rang` : la place du point sur le trait vert, ou -1 s'il n'est pas encore franchi.
function pastille(xy, rang, but, rayon, sansCoche, anneauAutour){
  const faite = rang >= 0;
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]);
  c.setAttribute('r', rayon || (faite ? 24 : but ? 20 : 13));
  c.setAttribute('class', 'pt' + (faite ? ' validee' : but ? ' but' : ''));
  gPts.appendChild(c);
  let coche = null;
  if (faite && !sansCoche){
    coche = document.createElementNS('http://www.w3.org/2000/svg','path');
    coche.setAttribute('class','coche');
    coche.setAttribute('d', 'M ' + (xy[0]-10) + ' ' + xy[1] +
                   ' L ' + (xy[0]-3) + ' ' + (xy[1]+7) +
                   ' L ' + (xy[0]+10) + ' ' + (xy[1]-8));
    gPts.appendChild(coche);
  }
  // Quand les points s'entassent, un anneau designe l'etape du jour.
  let anneau = null;
  if (anneauAutour){
    anneau = document.createElementNS('http://www.w3.org/2000/svg','circle');
    anneau.setAttribute('cx', xy[0]); anneau.setAttribute('cy', xy[1]);
    anneau.setAttribute('r', (rayon || 24) + 9);
    anneau.setAttribute('class', 'anneau');
    gPts.insertBefore(anneau, c);
  }
  pastilles.push({ c, coche, xy, rang, anneau });
}
// Une etape hors trace est tres pres de la ville qui la precede (Meze est a 34 km
// de Montpellier sur une carte de 1 400 km : une trentaine de pixels). Les deux
// disques de 24 px se recouvriraient. L'etape du jour est la vedette ; la ville
// d'avant devient un petit point, dont le rayon se deduit de la distance reelle
// pour qu'ils ne se touchent jamais.
// Avec plusieurs etapes hors trace (Beziers, Argeliers... a 25 km les unes des
// autres, une vingtaine de pixels), les petits points ne doivent pas non plus se
// toucher entre eux : leur rayon est borne par l'ecart qui les separe.
const petits = PM ? [P[ATTEINTE]].concat(PMS.slice(0, -1)) : [];     // ce qui precede l'etape du jour
const ecartA = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const ECART_PM = PM ? Math.min(...PTS_FAITS.slice(0, -1).map(q => ecartA(PM, q))) : 0;
let ECART_PETITS = Infinity;
for (let a = 0; a < petits.length; a++) for (let b = a + 1; b < petits.length; b++)
  ECART_PETITS = Math.min(ECART_PETITS, ecartA(petits[a], petits[b]));
const R_VEDETTE = PM ? Math.min(24, ECART_PM * 0.6) : 24;
const R_AVANT   = PM ? Math.max(5, Math.min(14, ECART_PM - R_VEDETTE - 4, ECART_PETITS / 2 - 1.5)) : 24;
VILLES.forEach((v,i)=>{
  const precede = PM && i === ATTEINTE;
  pastille(P[i], i <= ATTEINTE ? i : -1, i === VILLES.length-1, precede ? R_AVANT : 0, precede);
});
PMS.forEach((q, k) => {                                // les etapes hors trace, par-dessus
  if (k < PMS.length - 1) pastille(q, ATTEINTE + 1 + k, false, R_AVANT, true);
});
if (PM) pastille(PM, DERNIER, false, R_VEDETTE, false, PMS.length > 1);   // et l'etape du jour au sommet

// Placement libre du nom de l'etape du jour. Quand plusieurs etapes s'entassent
// a 25 km les unes des autres (une vingtaine de pixels), aucune position fixe ne
// convient : le nom tombait sur le point gris de Narbonne et sur la ligne grise.
// On essaie des positions autour de l'etape, de plus en plus loin, et on garde
// celle qui ne touche ni un point ni une ligne, la plus proche et de preference
// au-dessus.
function etiquetteLibre(centre, nom, rayon){
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('class', 'nom'); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('x', 0); t.setAttribute('y', 0); t.textContent = nom;
  gNoms.appendChild(t);
  const b0 = t.getBBox();                              // boite du texte pose en (0, 0)
  // les obstacles : tous les disques, et des points echantillonnes sur les deux traces
  const disques = pastilles.map(o => ({ x:o.xy[0], y:o.xy[1], r:+o.c.getAttribute('r') }));
  const points = [];
  [document.getElementById('fantome'), fait].forEach(chemin => {
    const L = chemin.getTotalLength();
    for (let l = 0; l <= L; l += 5){ const q = chemin.getPointAtLength(l); points.push([q.x, q.y]); }
  });
  const rect = (x, y) => [x + b0.x, y + b0.y, x + b0.x + b0.width, y + b0.y + b0.height];
  const MARGE = 12, M = 56;
  const gene = (x, y) => {
    const r = rect(x, y);
    if (r[0] < M || r[2] > W - M || r[1] < M || r[3] > H - M) return 1000;
    let n = 0;
    disques.forEach(d => {
      const px = Math.max(r[0], Math.min(d.x, r[2])), py = Math.max(r[1], Math.min(d.y, r[3]));
      if (Math.hypot(px - d.x, py - d.y) < d.r + MARGE) n++;
    });
    points.forEach(q => { if (q[0] > r[0]-MARGE && q[0] < r[2]+MARGE && q[1] > r[1]-MARGE && q[1] < r[3]+MARGE) n++; });
    return n;
  };
  let meilleur = null;
  for (const dist of [rayon + 40, rayon + 66, rayon + 96, rayon + 130, rayon + 170]){
    for (let a = 0; a < 360; a += 15){
      const rad = a * Math.PI / 180;
      const x = centre[0] + dist * Math.cos(rad), y = centre[1] + dist * Math.sin(rad) - (b0.y + b0.height / 2);
      const n = gene(x, y);
      const score = n * 1000 + dist + (Math.sin(rad) > 0 ? 25 : 0);    // le dessous est moins naturel
      if (!meilleur || score < meilleur.score) meilleur = { x, y, n, score };
    }
    if (meilleur && meilleur.n === 0) break;                          // la plus proche des positions libres
  }
  if (meilleur.n > 0) console.warn('nom de l\'etape : aucune position libre, ' + meilleur.n + ' contacts');
  t.setAttribute('x', meilleur.x.toFixed(1)); t.setAttribute('y', meilleur.y.toFixed(1));
  window.__placementNom = meilleur;
  return t;
}

// Deux noms seulement : l'etape du jour et le but, pour ne pas charger.
function etiquette(xy, nom, classe, dyy, ancre){
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1] + dyy);
  t.setAttribute('class', classe); t.setAttribute('text-anchor', ancre || 'middle');
  t.textContent = nom;
  gNoms.appendChild(t);
  const b = t.getBBox(), M = 56;
  const dd = Math.max(0, M - b.x) - Math.max(0, b.x + b.width - (W - M));
  if (dd) t.setAttribute('x', +t.getAttribute('x') + dd);
  return t;
}
const NOM_DU_JOUR = DU_JOUR ? DU_JOUR.nom : VILLES[ATTEINTE].nom;
// Hors trace, le nom se pose en haut a gauche de l'etape, du cote que la ville
// d'avant (en haut a droite) ne gene pas.
const nomEtape = PMS.length > 1 ? etiquetteLibre(PM, NOM_DU_JOUR, R_VEDETTE)
              : PM ? etiquette([PM[0] + 12, PM[1]], NOM_DU_JOUR, 'nom', -(R_VEDETTE + 22), 'end')
                   : etiquette(P[ATTEINTE], NOM_DU_JOUR, 'nom', -46);
const nomBut   = etiquette(P[VILLES.length-1], VILLES[VILLES.length-1].nom, 'nom but', -40);

// ───────────────────────────────────────────── le monument de l'etape
const mon = DU_JOUR ? MONUMENTS_ETAPES[DU_JOUR.nom] : MONUMENTS[ATTEINTE];
const svgMon = document.createElementNS('http://www.w3.org/2000/svg','svg');
svgMon.setAttribute('width', 520); svgMon.setAttribute('height', 570);
svgMon.setAttribute('viewBox','-14 -30 228 250');
svgMon.innerHTML = mon.traits.map(t=>'<path class="trait" d="'+t+'"/>').join('');
document.getElementById('scene2').appendChild(svgMon);
const traits = [...svgMon.querySelectorAll('.trait')].map(p=>{
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  return { el:p, L:L };
});

// ──────────────────────── la vitrine de fin : l'ordre est celui de la boutique
const PIECES = ['tshirt-noir', 'tshirt-blanc', 'short-noir', 'sans-manches', 'hoodie'];
const vitrine = document.getElementById('vitrine');
const PAS_PIECE = PAYSAGE ? 270 : 200;
const etals = PIECES.map((nom, i) => {
  const d = document.createElement('div');
  d.className = 'piece';
  d.style.left = (i * PAS_PIECE) + 'px';
  d.innerHTML = '<div class="fenetre"></div>' +
                '<img src="../assets/products/' + nom + '.png" alt="">';
  vitrine.appendChild(d);
  // Chaque fenetre montre sa part du degrade, comme une seule lumiere
  // derriere toute la rangee plutot que cinq lampes identiques.
  d.querySelector('.fenetre').style.backgroundPositionX = (-i * PAS_PIECE) + 'px';
  return d;
});

// ───────────────────────────────────────────── les mots
const UNITES = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix',
  'onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const DIZAINES = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];

function enLettres(n){
  if (n < 20) return UNITES[n];
  if (n < 100){
    const d = Math.floor(n/10), u = n%10;
    if (d === 7 || d === 9) return DIZAINES[d] + (u===1 && d===7 ? ' et ' : '-') + UNITES[10+u];
    let s = DIZAINES[d];
    if (u === 0) return d === 8 ? s + 's' : s;
    return s + (u === 1 ? ' et un' : '-' + UNITES[u]);
  }
  if (n < 1000){
    const c = Math.floor(n/100), r = n%100;
    let s = (c > 1 ? UNITES[c] + ' ' : '') + 'cent';
    if (c > 1 && r === 0) s += 's';
    return r ? s + ' ' + enLettres(r) : s;
  }
  const m = Math.floor(n/1000), r = n%1000;
  let s = (m > 1 ? UNITES[m] + ' ' : '') + 'mille';
  return r ? s + ' ' + enLettres(r) : s;
}

// Un texte trop long reduit sa taille plutot que de sortir de l'image : a
// l'etape suivante « quatre cent quatre-vingt-dix-neuf kilometres » ne tient
// pas sur la meme ligne que « trois cent vingt-deux kilometres ».
function tenir(el, largeurMax){
  const r = document.createRange();
  r.selectNodeContents(el);
  const l = r.getBoundingClientRect().width;
  if (l > largeurMax)
    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * largeurMax / l).toFixed(1) + 'px';
}

document.getElementById('ville').textContent = NOM_DU_JOUR;
document.getElementById('compte').textContent =
  enLettres(ATTEINTE + 1) + ' villes sur ' + enLettres(VILLES.length);
document.getElementById('km').textContent = enLettres(KM_FAITS) + ' kilomètres';
// L'augmentation depuis la derniere etape, quand l'etape en a une.
document.documentElement.classList.toggle('avec-plus', !!E.km_avant);
if (E.km_avant){
  document.getElementById('plus').textContent = '+ ' + enLettres(KM_FAITS - E.km_avant) + ' kilomètres';
  document.getElementById('depuis').textContent = 'depuis ' + E.depuis;
}
// Deux lignes : le nombre, puis l'unite. Sur une seule, « mille quatre-vingt-six
// kilomètres » deborde de l'image des que le nombre s'allonge.
document.getElementById('reste-nb').innerHTML =
  enLettres(KM_TOTAL - KM_FAITS) + '<br>kilomètres';
// Largeur disponible : l'image moins deux marges, ou la colonne de droite en paysage.
const LARGEUR_TEXTE = PAYSAGE ? 840 : 960;
['ville', 'compte', 'km', 'plus'].forEach(id => tenir(document.getElementById(id), LARGEUR_TEXTE));
tenir(document.getElementById('reste-nb'), PAYSAGE ? 1500 : 960);

// ───────────────────────────────────────────── le montage
// Tous les reperes de temps vivent ici, a un seul endroit : l'image les lit pour
// se peindre, et le son les lit (window.__reperes) pour poser ses notes. Une
// etape qui a une ligne d'augmentation allonge la scene des chiffres de D
// secondes, et tout ce qui suit recule d'autant.
const D = E.km_avant ? 2.1 : 0;
const T = {
  trace: [2.4, 6.4],                                    // le trait vert part de Nice, arrive a l'etape
  carte: [0.5, 1.6, 7.6, 8.3],
  monument: [8.1, 8.8, 14.5 + D, 15.2 + D],             // la scene du monument et des chiffres
  lignes: { ville: [10.3, 11.0], compte: [11.0, 11.7], km: [11.7, 12.4] },
  plus: [13.0, 13.7], depuis: [13.5, 14.2],             // seulement si l'etape a une augmentation
  reste: { scene: [15.0 + D, 15.7 + D, 18.6 + D, 19.3 + D], titre: [15.4 + D, 16.1 + D], nb: [15.9 + D, 16.6 + D] },
  vitrine: { scene: [18.6 + D, 19.3 + D, 22.7 + D, 23.4 + D], piece0: 19.0 + D, pas: 0.30,
             collection: [21.2 + D, 22.0 + D, 22.6 + D, 23.2 + D] },
  chute: { scene: [23.3 + D, 24.0 + D], fin: [23.6 + D, 24.3 + D], url: [24.5 + D, 25.2 + D] },
  duree: 26.1 + D
};
const DUREE = T.duree;
window.__duree = DUREE;

// Chaque point franchi s'allume quand le trait l'atteint.
const quandVille = i => T.trace[0] + (CUM[i]/CUM[DERNIER]) * (T.trace[1] - T.trace[0]);

// Ce que lit le son.
window.__reperes = {
  duree: DUREE,
  trace: T.trace,
  validations: PTS_FAITS.map((_, i) => quandVille(i)),
  lignes: [T.lignes.ville[0], T.lignes.compte[0], T.lignes.km[0]],
  plus: E.km_avant ? [T.plus[0], T.depuis[0]] : null,
  reste: [T.reste.titre[0], T.reste.nb[0]],
  piece0: T.vitrine.piece0, pas: T.vitrine.pas,
  collection: T.vitrine.collection[0],
  chute: T.chute.scene[0], url: T.chute.url[0]
};

const el = id => document.getElementById(id);

window.__render = function(t){
  etoiles.forEach(e=>{
    const s=e.base*(0.45+0.55*Math.abs(Math.sin(e.phase+t*e.vitesse)));
    e.el.style.opacity=(s*Math.min(1,seg(t,0,1.0))).toFixed(3);
  });

  // l'en-tete accompagne la carte, puis s'efface
  el('entete').style.opacity = fen(t, ...T.carte).toFixed(3);
  el('titre').style.opacity  = seg(t,1.2,2.2).toFixed(3);

  // 1 — la carte
  el('scene1').style.opacity = fen(t,1.0,1.8, T.carte[2],T.carte[3]).toFixed(3);
  el('fantome').style.opacity = (0.9*seg(t,1.4,2.3)).toFixed(3);
  fait.style.strokeDashoffset = (LFAIT * (1 - seg(t, T.trace[0], T.trace[1]))).toFixed(1);
  pastilles.forEach(o=>{
    const c = o.c;
    if (o.rang >= 0){
      const q = quandVille(o.rang);
      const k = seg(t, q, q + 0.35);
      c.style.opacity = k.toFixed(3);
      if (o.coche) o.coche.style.opacity = seg(t, q+0.15, q+0.5).toFixed(3);
      const e = 0.5 + 0.5*k;
      const tr = 'translate('+o.xy[0]+','+o.xy[1]+') scale('+e.toFixed(3)+
                     ') translate('+(-o.xy[0])+','+(-o.xy[1])+')';
      c.setAttribute('transform', tr);
      if (o.anneau){ o.anneau.style.opacity = (0.6*k).toFixed(3); o.anneau.setAttribute('transform', tr); }
    } else {
      c.style.opacity = (0.75*seg(t,1.8,2.6)).toFixed(3);
    }
  });
  nomEtape.style.opacity = seg(t, T.trace[1]-0.1, T.trace[1]+0.5).toFixed(3);
  nomBut.style.opacity   = (0.9*seg(t,2.0,2.8)).toFixed(3);

  // 2 — le monument et les chiffres
  el('scene2').style.opacity = fen(t, ...T.monument).toFixed(3);
  traits.forEach((p,i)=>{
    const d0 = 8.6 + (i / Math.max(1, traits.length-1)) * 1.5;
    p.el.style.strokeDashoffset = (p.L * (1 - seg(t, d0, d0+0.7))).toFixed(1);
  });
  el('ville').style.opacity   = seg(t, ...T.lignes.ville).toFixed(3);
  el('compte').style.opacity  = seg(t, ...T.lignes.compte).toFixed(3);
  el('km').style.opacity      = seg(t, ...T.lignes.km).toFixed(3);
  if (E.km_avant){
    el('plus').style.opacity   = seg(t, ...T.plus).toFixed(3);
    el('depuis').style.opacity = seg(t, ...T.depuis).toFixed(3);
  }

  // 3 — le reste a parcourir
  el('scene2b').style.opacity = fen(t, ...T.reste.scene).toFixed(3);
  el('reste-titre').style.opacity = seg(t, ...T.reste.titre).toFixed(3);
  el('reste-nb').style.opacity    = seg(t, ...T.reste.nb).toFixed(3);

  // 4 — la vitrine : ce qu'on trouve sur le site
  el('scene3').style.opacity = fen(t, ...T.vitrine.scene).toFixed(3);
  etals.forEach((d,i)=>{
    const k = seg(t, T.vitrine.piece0 + i*T.vitrine.pas, T.vitrine.piece0 + 0.8 + i*T.vitrine.pas);
    d.style.opacity = k.toFixed(3);
    d.style.transform = 'translateY(' + (34*(1-k)).toFixed(1) + 'px)';
  });
  el('collection').style.opacity = fen(t, ...T.vitrine.collection).toFixed(3);

  // 5 — la chute
  el('scene4').style.opacity = seg(t, ...T.chute.scene).toFixed(3);
  el('fin').style.opacity    = seg(t, ...T.chute.fin).toFixed(3);
  el('url').style.opacity    = seg(t, ...T.chute.url).toFixed(3);
};
window.__render(0);
</script>
