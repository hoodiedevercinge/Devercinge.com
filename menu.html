<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge</title>
<meta name="description" content="Devercinge : collection streetwear en édition limitée et aventure humaine.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devercinge">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:var(--bg);
  }

  .menu-container{
    position:relative;
    z-index:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 24px;
  }

  .brand-mark{
    width:120px;
    height:auto;
    display:block;
    margin-bottom:60px;
    filter:drop-shadow(0 0 20px rgba(155,107,255,.2));
    animation:fadeInDown .8s ease;
  }

  .menu-nav{
    position:absolute;
    top:0;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    z-index:2;
  }

  .menu-link{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-decoration:none;
    padding:8px 16px;
    border-radius:6px;
    transition:color .3s ease, background .3s ease;
  }

  .menu-link:hover, .menu-link:active{
    color:var(--ink);
    background:rgba(155,107,255,.1);
  }

  .menu-link.left{ margin-right:auto; }
  .menu-link.right{ margin-left:auto; }

  @keyframes fadeInDown{
    from{
      opacity:0;
      transform:translateY(-30px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .brand-mark{ animation:none; }
  }
</style>
</head>
<body>

  <div class="menu-nav">
    <a href="aventure.html" class="menu-link left">← Aventure</a>
    <a href="boutique.html" class="menu-link right">Boutique →</a>
  </div>

  <div class="menu-container">
    <img src="assets/logo-mark.png" alt="Devercinge" class="brand-mark">
  </div>

<script src="assets/js/cart.js"></script>
</body>
</html>
