<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge — Boutique</title>
<meta name="description" content="Boutique Devercinge : collection streetwear en édition limitée.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
    --line: #232227;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse 60% 40% at 12% 8%, rgba(155,107,255,.08), transparent 60%),
      radial-gradient(ellipse 60% 45% at 88% 92%, rgba(61,220,132,.08), transparent 60%),
      var(--bg);
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 20px max(24px, env(safe-area-inset-left));
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }

  .back-link{
    width:32px;
    height:auto;
    display:block;
    z-index:11;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
    animation:twinkle 3.5s ease-in-out infinite;
    cursor:pointer;
  }
  .back-link:hover{ opacity:.8; }

  .product-name{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-align:right;
    min-width:100px;
  }

  .stars{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    overflow:hidden;
    z-index:0;
    max-width:480px;
    margin:0 auto;
  }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--ink);
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.12;} 50%{opacity:.8;} }

  .brand-mark{
    width:40px;
    height:auto;
    display:block;
    position:absolute;
    top:calc(40px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    z-index:11;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
    animation:twinkle 3.5s ease-in-out infinite;
  }

  .gallery-container{
    position:relative;
    z-index:1;
    padding-top:60px;
    padding-bottom:100px;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    perspective:1000px;
  }

  .gallery{
    position:relative;
    width:100%;
    height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .gallery::-webkit-scrollbar{
    display:none;
  }

  .product-carousel{
    display:flex;
    gap:40px;
    padding:0 40px;
    width:100%;
  }

  .product-item{
    flex:0 0 320px;
    height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 25% 15%, rgba(155,107,255,.12), transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(61,220,132,.1), transparent 55%);
    border-radius:16px;
    padding:30px;
    cursor:pointer;
    scroll-snap-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    transform:scale(0.95);
    transition:transform .4s cubic-bezier(.25,.46,.45,.94);
  }

  .product-item:hover{
    transform:scale(1) translateZ(50px);
  }

  .product-item img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 10px 30px rgba(155,107,255,.2));
  }

  .shortcuts-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    max-width:480px;
    margin:0 auto;
    padding:16px 0;
    background:linear-gradient(180deg, transparent, var(--bg) 20%);
    border-top:1px solid var(--line);
    display:flex;
    justify-content:center;
    gap:40px;
  }

  .shortcut-item{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:color .2s ease;
  }

  .shortcut-item:hover, .shortcut-item:active{
    color:var(--ink);
  }

  .shortcut-line{
    width:40px;
    height:1px;
    background:var(--ink-dim);
    transition:background .2s ease;
  }

  .shortcut-item:hover .shortcut-line, .shortcut-item:active .shortcut-line{
    background:var(--ink);
  }

  .shortcut-label{
    font-size:11px;
    color:var(--ink-dim);
    transition:color .2s ease;
  }

  .shortcut-item:hover .shortcut-label, .shortcut-item:active .shortcut-label{
    color:var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .product-item, .hint{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <header>
    <a href="index.html" class="back-link">
      <img src="assets/logo-mark.png" alt="Menu">
    </a>
    <div class="product-name" id="productName">Sélectionne un article</div>
  </header>

  <div class="gallery-container">
    <div class="gallery" id="gallery">
      <div class="product-carousel" id="carousel"></div>
    </div>
  </div>

  <div class="shortcuts-bar">
    <a href="menu.html" class="shortcut-item">
      <div class="shortcut-line"></div>
      <div class="shortcut-label">Menu</div>
    </a>
    <a href="cart.html" class="shortcut-item">
      <div class="shortcut-line"></div>
      <div class="shortcut-label">Panier</div>
    </a>
    <a href="contact.html" class="shortcut-item">
      <div class="shortcut-line"></div>
      <div class="shortcut-label">Contact</div>
    </a>
  </div>

<script src="assets/js/cart.js"></script>
<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  const products = [
    { id: 'noir', name: 'Classique Dv Noir', image: 'assets/products/tshirt-noir.png' },
    { id: 'blanc', name: 'Classique Dv Blanc', image: 'assets/products/tshirt-blanc.png' },
    { id: 'short-noir', name: 'Le Short Dv Noir', image: 'assets/products/short-noir.png' },
    { id: 'short-blanc', name: 'Le Short Dv Blanc', image: 'assets/products/short-blanc.png' },
    { id: 'sweat', name: 'Hoodie Confort DV', image: 'assets/products/hoodie.png' }
  ];

  let currentIndex = 0;
  let isRotating = true;

  function createProductElement(product) {
    const div = document.createElement('div');
    div.className = 'product-item';

    div.innerHTML = `<img src="${product.image}" alt="${product.name}">`;

    div.addEventListener('click', () => {
      window.location.href = `product.html?item=${product.id}`;
    });

    return div;
  }

  function render() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = '';

    products.forEach((product) => {
      carousel.appendChild(createProductElement(product));
    });

    updateProductName();
  }

  function updateProductName() {
    const gallery = document.getElementById('gallery');
    const rect = gallery.getBoundingClientRect();
    const center = rect.left + rect.width / 2;

    let closestProduct = products[0];
    let closestDist = Infinity;

    document.querySelectorAll('.product-item').forEach((item, i) => {
      const itemRect = item.getBoundingClientRect();
      const itemCenter = itemRect.left + itemRect.width / 2;
      const dist = Math.abs(itemCenter - center);

      if (dist < closestDist) {
        closestDist = dist;
        closestProduct = products[i];
      }
    });

    document.getElementById('productName').textContent = closestProduct.name;
  }

  render();

  const gallery = document.getElementById('gallery');
  gallery.addEventListener('scroll', updateProductName);
</script>

</body>
</html>
