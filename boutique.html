<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge — Boutique</title>
<meta name="description" content="Boutique Devercinge : collection streetwear en édition limitée.">
<meta name="theme-color" content="#0a0a0c">
<link rel="canonical" href="https://hoodiedevercinge.github.io/Devercinge.com/boutique.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Devercinge">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://hoodiedevercinge.github.io/Devercinge.com/boutique.html">
<meta property="og:title" content="Devercinge — Boutique">
<meta property="og:description" content="La collection Devercinge en édition limitée : t-shirts, shorts et hoodies.">
<meta property="og:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Devercinge — Boutique">
<meta name="twitter:description" content="La collection Devercinge en édition limitée : t-shirts, shorts et hoodies.">
<meta name="twitter:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
    --line: #232227;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse 60% 40% at 12% 8%, rgba(155,107,255,.08), transparent 60%),
      radial-gradient(ellipse 60% 45% at 88% 92%, rgba(61,220,132,.08), transparent 60%),
      var(--bg);
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 20px max(24px, env(safe-area-inset-left));
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }

  .back-link{
    width:32px;
    flex:0 0 32px;
    display:block;
    line-height:0;
    z-index:11;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
    animation:twinkle 3.5s ease-in-out infinite;
    cursor:pointer;
  }
  .back-link img{
    width:100%;
    height:auto;
    display:block;
  }
  .back-link:hover{ opacity:.8; }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:600;
    /* La lettre finale traine son interlettrage : on compense pour recentrer. */
    padding-left:.28em;
    background:linear-gradient(90deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .product-meta{ text-align:right; }

  .product-name{
    margin-top:5px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-align:right;
    min-width:100px;
  }

  .stars{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    overflow:hidden;
    z-index:0;
    max-width:480px;
    margin:0 auto;
  }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--ink);
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.12;} 50%{opacity:.8;} }

  /* Quelques etoiles lancent une etincelle de temps en temps. Elles ne
     scintillent pas : l'opacite du parent multiplierait celle de
     l'etincelle et le flash tomberait parfois dans un creux. */
  .stars span.sparkle{
    opacity:.85;
    animation:etincelle-coeur 8s ease-in-out infinite;
    animation-delay:var(--etincelle-delai, 0s);
  }
  .stars span.sparkle::before,
  .stars span.sparkle::after{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    opacity:0;
    animation:etincelle 8s ease-in-out infinite;
    animation-delay:var(--etincelle-delai, 0s);
  }
  .stars span.sparkle::before{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--ink), transparent);
  }
  .stars span.sparkle::after{
    width:1px;
    height:46px;
    background:linear-gradient(180deg, transparent, var(--ink), transparent);
  }

  @keyframes etincelle{
    0%, 90%, 100%{ opacity:0; transform:translate(-50%,-50%) scale(.2); }
    95%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }

  /* Le point lui-meme s'embrase en meme temps que ses branches. */
  @keyframes etincelle-coeur{
    0%, 90%, 100%{ box-shadow:0 0 0 0 rgba(242,241,239,0); }
    95%{ box-shadow:0 0 12px 2px rgba(242,241,239,.8); }
  }

  .gallery-container{
    position:relative;
    z-index:1;
    padding-top:60px;
    padding-bottom:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    perspective:1000px;
  }

  .gallery{
    position:relative;
    width:100%;
    /* Remplit le cadre : donne une hauteur definie aux articles. */
    height:100%;
    display:flex;
    align-items:center;
    /* Surtout pas center : le carrousel est plus large que la galerie,
       le centrer le fait deborder a gauche dans une zone que le scroll
       ne peut pas atteindre. */
    justify-content:flex-start;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    /* Pas de scroll-behavior ici : le recalage du defilement infini se fait
       par un bond instantane, qu'un smooth pose en CSS transformerait en
       longue glissade bien visible. Chaque deplacement dit lui-meme s'il
       veut etre doux. */
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .gallery::-webkit-scrollbar{
    display:none;
  }

  .product-carousel{
    display:flex;
    align-items:center;
    gap:40px;
    /* Largeur du contenu, pas celle du cadre : avec width:100% la marge
       de fin tombe avant le dernier article, qui ne peut plus se
       centrer sous le scroll-snap. flex-shrink:0 empeche la galerie de
       la reduire. */
    flex:0 0 auto;
    width:max-content;
    /* Au moins (480 - 358) / 2, de quoi centrer le premier et le
       dernier article sur le cadre le plus large. */
    padding:0 64px;
    /* Sans hauteur definie ici, le height:100% des articles ne se
       resout pas et chacun prend la taille de son image. */
    height:100%;
  }

  .product-item{
    flex:0 0 358px;
    /* Rectangle vertical, facon embrasure de porte, jusqu'en bas. */
    height:100%;
    /* Largeur de la fenetre. Le cadre et son reflet la partagent, le
       vetement non : il garde toute la largeur de la carte. */
    --fenetre:44%;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    scroll-snap-align:center;
    transform:scale(0.95);
    /* Le retrait se fait vers le haut : le bas du rectangle reste colle
       au bord de l'ecran. */
    transform-origin:bottom center;
    transition:transform .4s cubic-bezier(.25,.46,.45,.94);
  }


  .product-item:hover{
    transform:scale(1) translateZ(50px);
  }

  .product-stage{
    position:relative;
    flex:0 0 68%;
    min-height:0;
  }

  /* La fenetre : c'est elle qui se reflete, pas le vetement. */
  .product-frame{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:var(--fenetre);
    background:radial-gradient(circle at 25% 15%, rgba(155,107,255,.22), transparent 58%),
                radial-gradient(circle at 80% 85%, rgba(61,220,132,.18), transparent 58%);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }

  /* Pose par-dessus la fenetre, et non dedans : le vetement garde sa
     taille meme quand la fenetre se resserre. */
  .product-shot{
    position:absolute;
    left:18px;
    right:18px;
    top:64%;
    transform:translateY(-50%);
    margin:0 auto;
    max-width:calc(100% - 36px);
    max-height:calc(100% - 36px);
    width:auto;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 10px 30px rgba(155,107,255,.2));
  }

  /* La fenetre reprise a l'envers sous la surface. */
  .product-mirror{
    flex:1 1 auto;
    min-height:0;
    width:var(--fenetre);
    margin:0 auto;
    background:radial-gradient(circle at 25% 15%, rgba(155,107,255,.22), transparent 58%),
                radial-gradient(circle at 80% 85%, rgba(61,220,132,.18), transparent 58%);
    transform:scaleY(-1);
    /* Opaque en bas dans le repere local : une fois retourne, c'est le
       haut du reflet, contre la surface. */
    -webkit-mask-image:linear-gradient(to top, #000, transparent 88%);
    mask-image:linear-gradient(to top, #000, transparent 88%);
    pointer-events:none;
  }

  /* Au clic, toute la scene se rapproche du vetement : la fenetre reste
     derriere lui pendant le mouvement. */
  .gallery-container{
    transition:transform .45s cubic-bezier(.4,0,.6,1), opacity .45s ease-in;
  }
  body.zoom .gallery-container{
    /* Assez pour sentir qu'on entre dans la piece, pas au point de
       n'avoir plus qu'un aplat de tissu a l'ecran. */
    transform:scale(1.7);
    opacity:0;
  }
  body.zoom header,
  body.zoom .shortcuts-bar{
    opacity:0;
    transition:opacity .25s ease;
  }
  body.zoom{ pointer-events:none; }

  .shortcuts-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    max-width:480px;
    margin:0 auto;
    padding:16px 0;
    background:linear-gradient(180deg, transparent, var(--bg) 20%);
    border-top:1px solid var(--line);
    display:flex;
    justify-content:center;
    gap:40px;
  }

  .shortcut-item{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:110px;
    gap:8px;
    text-decoration:none;
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:color .2s ease;
  }

  .shortcut-item:hover, .shortcut-item:active{
    color:var(--ink);
  }

  .shortcut-line{
    width:40px;
    height:1px;
    background:var(--ink-dim);
    transition:background .2s ease;
  }

  .shortcut-item:hover .shortcut-line, .shortcut-item:active .shortcut-line{
    background:var(--ink);
  }

  .shortcut-label{
    font-size:11px;
    color:var(--ink-dim);
    transition:color .2s ease;
  }

  .shortcut-count{
    display:none;
    margin-left:2px;
    color:var(--violet);
    font-weight:700;
  }

  .shortcut-item:hover .shortcut-label, .shortcut-item:active .shortcut-label{
    color:var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .product-item, .back-link, .stars span, .stars span.sparkle,
    .stars span.sparkle::before, .stars span.sparkle::after{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <header>
    <a href="index.html" class="back-link">
      <img src="assets/logo-mark.png" alt="Menu">
    </a>
    <div class="product-meta">
      <div class="eyebrow">Cinq pièces</div>
      <div class="product-name" id="productName">Sélectionne un article</div>
    </div>
  </header>

  <div class="gallery-container">
    <div class="gallery" id="gallery">
      <div class="product-carousel" id="carousel"></div>
    </div>
  </div>

  <div class="shortcuts-bar">
    <a href="cart.html" class="shortcut-item">
      <div class="shortcut-line"></div>
      <div class="shortcut-label">Panier <span class="shortcut-count" data-cart-badge>0</span></div>
    </a>
    <a href="contact.html" class="shortcut-item">
      <div class="shortcut-line"></div>
      <div class="shortcut-label">Contact</div>
    </a>
  </div>

<script src="assets/js/cart.js"></script>
<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  // Une poignee d'etoiles recoit l'etincelle, a des moments differents.
  const etincelles = [...starsContainer.children]
    .sort(() => Math.random() - 0.5)
    .slice(0, 6);
  etincelles.forEach(s => {
    s.classList.add('sparkle');
    s.style.setProperty('--etincelle-delai', (Math.random() * 8).toFixed(1) + 's');
  });

  const products = [
    { id: 'noir', name: 'Le Classique Dv Noir', image: 'assets/products/tshirt-noir.png' },
    { id: 'blanc', name: 'Le Classique Dv Blanc', image: 'assets/products/tshirt-blanc.png' },
    { id: 'short-noir', name: 'Le Short Dv Noir', image: 'assets/products/short-noir.png' },
    { id: 'sans-manches', name: 'Le Classique Dv Sans Manche', image: 'assets/products/sans-manches.png' },
    { id: 'sweat', name: 'Le Hoodie Confort DV', image: 'assets/products/hoodie.png' }
  ];

  function createProductElement(product) {
    const div = document.createElement('div');
    div.className = 'product-item';

    div.innerHTML = `
      <div class="product-stage">
        <div class="product-frame"></div>
        <img src="${product.image}" alt="${product.name}" class="product-shot">
      </div>
      <div class="product-mirror"></div>`;

    div.addEventListener('click', () => {
      const url = `product.html?item=${product.id}`;
      const doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (doux || document.body.classList.contains('zoom')) {
        window.location.href = url;
        return;
      }
      // Le zoom part du vetement clique, pas du centre de l'ecran.
      const scene = document.querySelector('.gallery-container');
      const vetement = div.querySelector('.product-shot').getBoundingClientRect();
      const cadre = scene.getBoundingClientRect();
      scene.style.transformOrigin =
        (vetement.left + vetement.width / 2 - cadre.left) + 'px ' +
        (vetement.top + vetement.height / 2 - cadre.top) + 'px';
      document.body.classList.add('zoom');
      setTimeout(() => { window.location.href = url; }, 430);
    });

    return div;
  }

  // Trois jeux d'articles a la suite. On vit dans celui du milieu : des
  // qu'on en sort, le defilement est recale d'une largeur de jeu. Comme les
  // trois jeux sont identiques et regulierement espaces -- l'ecart de 40 px
  // vaut aussi entre le dernier d'un jeu et le premier du suivant -- le bond
  // tombe sur une image identique et ne se voit pas.
  const JEUX = 3;

  function render() {
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = '';
    for (let j = 0; j < JEUX; j++) {
      products.forEach((product) => {
        const el = createProductElement(product);
        // L'article porte sa piece : avec les copies, sa place dans le DOM
        // ne dit plus de quel produit il s'agit.
        el.produit = product;
        carousel.appendChild(el);
      });
    }
    updateProductName();
  }

  const gallery = document.getElementById('gallery');
  const carousel = document.getElementById('carousel');
  const articles = () => [...carousel.children];

  function auCentre() {
    const items = articles();
    const centre = gallery.scrollLeft + gallery.clientWidth / 2;
    let plusProche = items[0], ecart = Infinity, rang = 0;
    items.forEach((el, j) => {
      const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - centre);
      if (d < ecart) { ecart = d; plusProche = el; rang = j; }
    });
    return { el: plusProche, rang };
  }

  function updateProductName() {
    const { el } = auCentre();
    if (el && el.produit) {
      document.getElementById('productName').textContent = el.produit.name;
    }
  }

  function largeurJeu() {
    const items = articles();
    return items.length > products.length
      ? items[products.length].offsetLeft - items[0].offsetLeft : 0;
  }

  const placeDe = (el) =>
    el.offsetLeft - (gallery.clientWidth - el.offsetWidth) / 2;

  function centrer(el) { gallery.scrollLeft = placeDe(el); }

  // On mene le defilement nous-memes, image par image, plutot que de le
  // confier a scrollTo({behavior:'smooth'}) : le calage magnetique se bat
  // avec un defilement pilote et Safari annule le mouvement, si bien que le
  // carrousel ne demarre jamais. On retire le calage pendant l'animation et
  // on le rend au doigt aussitot apres.
  let glissee = null, enGlissade = false;

  function glisser(el) {
    cancelAnimationFrame(glissee);
    const depart = gallery.scrollLeft;
    const delta = placeDe(el) - depart;
    if (Math.abs(delta) < 1) return;
    enGlissade = true;
    gallery.style.scrollSnapType = 'none';
    const lisse = (x) => x * x * (3 - 2 * x);
    const t0 = performance.now();
    (function pas(t) {
      const k = Math.min(1, (t - t0) / GLISSEE);
      gallery.scrollLeft = depart + delta * lisse(k);
      if (k < 1) { glissee = requestAnimationFrame(pas); return; }
      // Le bond de recalage se fait tant que le calage magnetique est
      // encore coupe. Rendu avant le bond, le navigateur se bat avec un
      // saut qu'il n'a pas decide et repose la galerie entre deux
      // articles -- ce qui se voit surtout sur le dernier du jeu, juste
      // la ou tombe le recalage.
      recadrer();
      enGlissade = false;
      requestAnimationFrame(() => { gallery.style.scrollSnapType = ''; });
    })(t0);
  }

  // Ramene le defilement dans le jeu du milieu, d'un bond sec.
  function recadrer() {
    const w = largeurJeu();
    if (!w) return;
    if (gallery.scrollLeft < w * 0.5) gallery.scrollLeft += w;
    else if (gallery.scrollLeft >= w * 1.5) gallery.scrollLeft -= w;
  }

  render();

  const doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CADENCE = 2800;   // le temps de regarder une piece avant la suivante
  const GLISSEE = 650;    // la duree du passage d'un article au suivant
  const REPRISE = 4000;   // apres une manipulation, avant que ca reparte
  let minuteur = null, reprise = null, pose = null;

  function suivant() {
    const items = articles();
    const { rang } = auCentre();
    glisser(items[Math.min(rang + 1, items.length - 1)]);
  }

  function lancer() {
    if (doux || minuteur) return;
    minuteur = setInterval(suivant, CADENCE);
  }

  function suspendre() {
    // Le doigt reprend la main : on coupe l'animation en cours et on lui
    // rend le calage magnetique tout de suite.
    cancelAnimationFrame(glissee);
    enGlissade = false;
    gallery.style.scrollSnapType = '';
    clearInterval(minuteur); minuteur = null;
    clearTimeout(reprise);
    reprise = setTimeout(lancer, REPRISE);
  }

  // Le recalage attend que tout se soit pose : le faire pendant un
  // deplacement doux l'interromprait au milieu.
  gallery.addEventListener('scroll', () => {
    updateProductName();
    clearTimeout(pose);
    // Une glissade recale elle-meme en arrivant. Si le compte a rebours
    // arrivait au bout pendant qu'elle court -- une image en retard sur un
    // telephone charge suffit --, la galerie sauterait d'un jeu entier
    // pendant que la glissade continue d'interpoler depuis son ancien
    // point de depart, et l'article vise finirait a cote de l'ecran.
    if (enGlissade) return;
    pose = setTimeout(recadrer, 140);
  }, { passive: true });

  ['pointerdown', 'touchstart', 'wheel'].forEach((ev) =>
    gallery.addEventListener(ev, suspendre, { passive: true }));

  // Onglet en arriere-plan : inutile de faire defiler dans le vide.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(glissee);
      enGlissade = false;
      clearInterval(minuteur); minuteur = null;
    }
    else lancer();
  });

  // On demarre sur le premier article du jeu du milieu, pour avoir autant
  // de marge d'un cote que de l'autre.
  requestAnimationFrame(() => {
    centrer(articles()[products.length]);
    updateProductName();
    lancer();
  });
</script>

</body>
</html>
