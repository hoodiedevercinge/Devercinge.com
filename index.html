<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge</title>
<meta name="description" content="Devercinge : collection streetwear en édition limitée et aventure humaine.">
<meta name="theme-color" content="#0a0a0c">
<link rel="canonical" href="https://hoodiedevercinge.github.io/Devercinge.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Devercinge">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://hoodiedevercinge.github.io/Devercinge.com/">
<meta property="og:title" content="Devercinge">
<meta property="og:description" content="Devercinge : collection streetwear en édition limitée et aventure humaine.">
<meta property="og:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Devercinge">
<meta name="twitter:description" content="Devercinge : collection streetwear en édition limitée et aventure humaine.">
<meta name="twitter:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devercinge">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:var(--bg);
  }

  .stars{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    overflow:hidden;
    z-index:0;
    opacity:0;
    transition:opacity .6s ease;
  }
  body.opened .stars{ opacity:1; }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--ink);
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.85; } }

  .menu-container{
    position:relative;
    z-index:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 24px;
  }

  .brand-mark{
    width:280px;
    height:auto;
    display:block;
    margin-bottom:34px;
    filter:drop-shadow(0 0 20px rgba(155,107,255,.2));
    animation:fadeInDown .8s ease, twinkle 3.5s ease-in-out infinite;
    cursor:pointer;
    transition:width .6s cubic-bezier(.25,.46,.45,.94), margin-bottom .6s cubic-bezier(.25,.46,.45,.94);
    z-index:2;
    position:relative;
  }

  .brand-mark.active{
    width:120px;
    margin-bottom:26px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:600;
    /* La lettre finale traine son interlettrage : on compense pour recentrer. */
    padding-left:.28em;
    background:linear-gradient(90deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  /* Les deux fragments se croisent au meme endroit : pas de saut de mise en page. */
  .menu-words{
    position:relative;
    height:14px;
    width:100%;
    z-index:2;
  }
  .menu-words .eyebrow{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    white-space:nowrap;
    transition:opacity .6s ease;
  }
  .word-open{ opacity:0; }
  body.opened .word-idle{ opacity:0; }
  body.opened .word-open{ opacity:1; }

  .menu-nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    max-width:480px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    z-index:2;
  }

  .menu-link{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-decoration:none;
    padding:8px 16px;
    border-radius:6px;
    transition:color .3s ease, background .3s ease, opacity .6s ease;
    opacity:0;
    pointer-events:none;
  }

  .menu-link.active{
    opacity:1;
    pointer-events:auto;
  }

  .menu-link:hover, .menu-link:active{
    color:var(--ink);
    background:rgba(155,107,255,.1);
  }

  .menu-link.left{
    position:fixed;
    left:max(20px, env(safe-area-inset-left));
    top:calc(20px + env(safe-area-inset-top));
  }
  .menu-link.right{
    position:fixed;
    right:max(20px, env(safe-area-inset-right));
    top:calc(20px + env(safe-area-inset-top));
  }

  @keyframes fadeInDown{
    from{
      opacity:0;
      transform:translateY(-30px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  @keyframes logoExpand{
    from{
      opacity:0;
      transform:scale(0.3);
    }
    to{
      opacity:1;
      transform:scale(1);
    }
  }

  @keyframes starsParallax{
    from{
      opacity:0;
      transform:scale(2.5) translateZ(1000px);
    }
    to{
      opacity:1;
      transform:scale(1) translateZ(0);
    }
  }

  @keyframes starsZoomIn{
    from{
      opacity:1;
      transform:scale(1) translateZ(0);
    }
    to{
      opacity:0;
      transform:scale(0.4) translateZ(-1000px);
    }
  }

  body.returning .brand-mark{
    animation:logoExpand .8s cubic-bezier(.25,.46,.45,.94);
  }

  body.returning .stars span{
    animation:starsZoomIn .8s cubic-bezier(.25,.46,.45,.94), twinkle 3s ease-in-out infinite;
    animation-delay:0s, calc((var(--star-delay, 0) * 3.5s));
  }

  body.opening .stars span{
    animation:starsParallax .8s cubic-bezier(.25,.46,.45,.94), twinkle 3s ease-in-out infinite;
    animation-delay:0s, calc((var(--star-delay, 0) * 3.5s));
  }

  @media (prefers-reduced-motion: reduce){
    .brand-mark, .stars span{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="menu-nav">
    <a href="aventure.html" class="menu-link left">← Aventure</a>
    <a href="boutique.html" class="menu-link right">Boutique →</a>
  </div>

  <div class="menu-container">
    <img src="assets/logo-mark.png" alt="Devercinge" class="brand-mark">
    <div class="menu-words">
      <div class="eyebrow word-idle">Deux créateurs</div>
      <div class="eyebrow word-open">Un seul rêve</div>
    </div>
  </div>

<script src="assets/js/cart.js"></script>
<script>
  const logo = document.querySelector('.brand-mark');
  const menuLinks = document.querySelectorAll('.menu-link');
  const starsContainer = document.getElementById('stars');

  // Generate stars
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  // Add animation delay to each star
  const stars = starsContainer.querySelectorAll('span');
  stars.forEach((star, i) => {
    star.style.setProperty('--star-delay', Math.random());
  });

  // Detect when returning to this page (via back button or history)
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      document.body.classList.add('returning');
      document.body.classList.remove('opened');
      logo.classList.remove('active');
      menuLinks.forEach(link => link.classList.remove('active'));
      setTimeout(() => {
        document.body.classList.remove('returning');
      }, 900);
    }
  });

  logo.addEventListener('click', () => {
    logo.classList.add('active');
    menuLinks.forEach(link => link.classList.add('active'));
    document.body.classList.add('opened', 'opening');
    setTimeout(() => {
      document.body.classList.remove('opening');
    }, 900);
  });
</script>
</body>
</html>
