<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devercinge</title>
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
    --line: #232227;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    overflow:hidden;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .stars{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    overflow:hidden;
    z-index:0;
    max-width:480px;
    margin:0 auto;
  }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--ink);
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.12;} 50%{opacity:.8;} }

  .splash{
    position:relative;
    z-index:1;
    text-align:center;
    padding:0 32px;
  }

  .logo-wrap{
    width:120px;
    height:120px;
    margin:0 auto 28px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(155,107,255,.25), transparent 60%),
      radial-gradient(circle at 70% 75%, rgba(61,220,132,.2), transparent 60%),
      #131316;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 rgba(155,107,255,0); }
    50%{ transform:scale(1.04); box-shadow:0 0 24px rgba(155,107,255,.25); }
  }

  .logo-wrap span{
    font-family:'Arial Black', 'Segoe UI Black', sans-serif;
    font-size:34px;
    letter-spacing:.02em;
    background:linear-gradient(135deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  h1{
    font-family:'Arial Black', 'Segoe UI Black', sans-serif;
    font-size:22px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink);
  }

  .hint{
    margin-top:14px;
    font-size:13px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    line-height:1.6;
  }

  .shake-icon{
    display:inline-block;
    margin-top:22px;
    animation:shake-hint 1.6s ease-in-out infinite;
  }
  @keyframes shake-hint{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-14deg); }
    40%{ transform:rotate(12deg); }
    60%{ transform:rotate(-10deg); }
    80%{ transform:rotate(8deg); }
  }

  .enable-btn{
    margin-top:28px;
    padding:13px 28px;
    background:transparent;
    border:1px solid var(--violet);
    border-radius:30px;
    color:var(--ink);
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
  }

  .skip-link{
    display:block;
    margin-top:20px;
    font-size:12px;
    color:var(--ink-dim);
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .fade-out{
    animation:fadeOut .5s ease forwards;
  }
  @keyframes fadeOut{
    to{ opacity:0; transform:scale(1.05); }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="splash" id="splash">
    <div class="logo-wrap">
      <span>DV</span>
    </div>
    <h1>Devercinge</h1>
    <p class="hint" id="hintText">Secoue ton téléphone<br>pour entrer</p>
    <div class="shake-icon">📳</div>
    <br>
    <button class="enable-btn" id="enableBtn" style="display:none;">Activer les capteurs</button>
    <a href="gallery.html" class="skip-link">Entrer sans secouer</a>
  </div>

<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 60;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  const splash = document.getElementById('splash');
  const enableBtn = document.getElementById('enableBtn');
  const hintText = document.getElementById('hintText');

  let lastX, lastY, lastZ;
  let lastTime = 0;
  const SHAKE_THRESHOLD = 18;
  let hasEntered = false;

  function enterSite() {
    if (hasEntered) return;
    hasEntered = true;
    splash.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = 'gallery.html';
    }, 450);
  }

  function handleMotion(event) {
    const acc = event.accelerationIncludingGravity;
    if (!acc) return;

    const currentTime = Date.now();
    if (currentTime - lastTime < 100) return;

    const { x, y, z } = acc;
    if (lastX !== undefined) {
      const deltaX = Math.abs(x - lastX);
      const deltaY = Math.abs(y - lastY);
      const deltaZ = Math.abs(z - lastZ);

      if ((deltaX + deltaY + deltaZ) > SHAKE_THRESHOLD) {
        enterSite();
      }
    }

    lastX = x; lastY = y; lastZ = z;
    lastTime = currentTime;
  }

  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    enableBtn.style.display = 'inline-block';
    hintText.innerHTML = 'Active les capteurs,<br>puis secoue ton téléphone';
    enableBtn.addEventListener('click', () => {
      DeviceMotionEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            enableBtn.style.display = 'none';
            hintText.innerHTML = 'Secoue ton téléphone<br>pour entrer';
          } else {
            hintText.innerHTML = 'Capteurs refusés —<br>utilise le lien ci-dessous';
          }
        })
        .catch(() => {
          hintText.innerHTML = 'Capteurs indisponibles —<br>utilise le lien ci-dessous';
        });
    });
  } else if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', handleMotion);
  } else {
    hintText.innerHTML = 'Capteurs non disponibles<br>sur cet appareil';
  }
</script>

</body>
</html>
