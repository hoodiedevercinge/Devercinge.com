<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devercinge — Galerie</title>
<style>
  :root{
    --bg: #0a0a12;
    --card: #171726;
    --ink: #f3f1ec;
    --ink-dim: #b8b6c8;
    --star: #e9eaf5;
    --gold: #e3b563;
    --line: #2a2a3d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    overflow-x:hidden;
  }

  .stars{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    overflow:hidden;
    z-index:0;
    max-width:480px;
    margin:0 auto;
  }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--star);
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
  @media (prefers-reduced-motion: reduce){ .stars span{ animation:none; opacity:.4; } }

  header{
    position:relative;
    z-index:1;
    padding:56px 24px 28px;
    text-align:center;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:14px;
  }

  h1{
    font-family:'Arial Black', 'Segoe UI Black', sans-serif;
    font-size:34px;
    text-transform:uppercase;
    letter-spacing:-.01em;
    color:var(--star);
    text-shadow:0 0 18px rgba(233,234,245,.35);
  }

  .tagline{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.6;
    padding:0 20px;
  }

  .gallery-wrap{
    position:relative;
    z-index:1;
    margin-top:12px;
  }

  .gallery{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    gap:0;
    padding:0 0 8px;
    scrollbar-width:none;
  }
  .gallery::-webkit-scrollbar{ display:none; }

  .slide{
    flex:0 0 100%;
    scroll-snap-align:center;
    padding:0 28px;
  }

  .frame{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px 24px 26px;
    position:relative;
    transition:transform .2s ease, border-color .2s ease;
  }
  .frame:active{ transform:scale(.98); }

  .frame-visual{
    aspect-ratio:4/5;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, rgba(233,181,99,.12), transparent 55%),
      linear-gradient(160deg, #1b1b2c, #0d0d16);
    border:1px solid var(--line);
  }

  .piece{
    width:56%;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));
  }
  .piece svg{ width:100%; height:auto; display:block; }
  .piece .print{
    font-family:'Arial Black', sans-serif;
    font-size:11px;
    letter-spacing:.08em;
  }

  .caption{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .caption .num{
    font-size:11px;
    letter-spacing:.15em;
    color:var(--gold);
  }
  .caption .view{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .piece-title{
    margin-top:6px;
    font-size:18px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }

  .dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:20px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--line);
    transition:background .2s ease, transform .2s ease;
  }
  .dot.active{
    background:var(--gold);
    transform:scale(1.3);
  }

  .hint{
    text-align:center;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-dim);
    margin-top:14px;
    text-transform:uppercase;
  }

  footer{
    position:relative;
    z-index:1;
    padding:52px 24px 48px;
    text-align:center;
    border-top:1px solid var(--line);
    margin-top:56px;
  }
  footer .name{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <header>
    <div class="eyebrow">Collection</div>
    <h1>Devercinge</h1>
    <p class="tagline">Quatre pièces. Fais glisser pour découvrir, touche une pièce pour l'ouvrir.</p>
  </header>

  <div class="gallery-wrap">
    <div class="gallery" id="gallery">

      <div class="slide">
        <a class="frame" href="product.html?design=sirius">
          <div class="frame-visual">
            <div class="piece">
              <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 20 L20 45 L35 70 L55 58 L55 180 L145 180 L145 58 L165 70 L180 45 L140 20 L120 32 C120 32 112 40 100 40 C88 40 80 32 80 32 Z"
                      fill="#1f1f30" stroke="#3a3a52" stroke-width="2"/>
                <circle cx="100" cy="105" r="26" fill="none" stroke="#e3b563" stroke-width="1.4"/>
                <text x="100" y="112" text-anchor="middle" class="print" fill="#e3b563">SIRIUS</text>
              </svg>
            </div>
          </div>
          <div class="caption">
            <span class="num">N°01</span>
            <span class="view">Ouvrir →</span>
          </div>
          <div class="piece-title">Sirius</div>
        </a>
      </div>

      <div class="slide">
        <a class="frame" href="product.html?design=constellation">
          <div class="frame-visual">
            <div class="piece">
              <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 20 L20 45 L35 70 L55 58 L55 180 L145 180 L145 58 L165 70 L180 45 L140 20 L120 32 C120 32 112 40 100 40 C88 40 80 32 80 32 Z"
                      fill="#1f1f30" stroke="#3a3a52" stroke-width="2"/>
                <g stroke="#e9eaf5" stroke-width="1" fill="#e9eaf5">
                  <circle cx="78" cy="90" r="2"/>
                  <circle cx="100" cy="78" r="2.4"/>
                  <circle cx="124" cy="92" r="2"/>
                  <circle cx="112" cy="118" r="1.8"/>
                  <circle cx="90" cy="120" r="1.8"/>
                  <line x1="78" y1="90" x2="100" y2="78" stroke-width=".6"/>
                  <line x1="100" y1="78" x2="124" y2="92" stroke-width=".6"/>
                  <line x1="124" y1="92" x2="112" y2="118" stroke-width=".6"/>
                  <line x1="112" y1="118" x2="90" y2="120" stroke-width=".6"/>
                  <line x1="90" y1="120" x2="78" y2="90" stroke-width=".6"/>
                </g>
              </svg>
            </div>
          </div>
          <div class="caption">
            <span class="num">N°02</span>
            <span class="view">Ouvrir →</span>
          </div>
          <div class="piece-title">Constellation</div>
        </a>
      </div>

      <div class="slide">
        <a class="frame" href="product.html?design=lune">
          <div class="frame-visual">
            <div class="piece">
              <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 20 L20 45 L35 70 L55 58 L55 180 L145 180 L145 58 L165 70 L180 45 L140 20 L120 32 C120 32 112 40 100 40 C88 40 80 32 80 32 Z"
                      fill="#1f1f30" stroke="#3a3a52" stroke-width="2"/>
                <path d="M112 78 A22 22 0 1 0 112 122 A17 17 0 1 1 112 78 Z" fill="#e3b563"/>
              </svg>
            </div>
          </div>
          <div class="caption">
            <span class="num">N°03</span>
            <span class="view">Ouvrir →</span>
          </div>
          <div class="piece-title">Lune</div>
        </a>
      </div>

      <div class="slide">
        <a class="frame" href="product.html?design=devercinge">
          <div class="frame-visual">
            <div class="piece">
              <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 20 L20 45 L35 70 L55 58 L55 180 L145 180 L145 58 L165 70 L180 45 L140 20 L120 32 C120 32 112 40 100 40 C88 40 80 32 80 32 Z"
                      fill="#1f1f30" stroke="#3a3a52" stroke-width="2"/>
                <text x="100" y="100" text-anchor="middle" class="print" fill="#f3f1ec" font-size="13">DEVER</text>
                <text x="100" y="116" text-anchor="middle" class="print" fill="#f3f1ec" font-size="13">CINGE</text>
              </svg>
            </div>
          </div>
          <div class="caption">
            <span class="num">N°04</span>
            <span class="view">Ouvrir →</span>
          </div>
          <div class="piece-title">Devercinge</div>
        </a>
      </div>

    </div>

    <div class="dots" id="dots"></div>
    <p class="hint">← Glisse pour voir la collection →</p>
  </div>

  <footer>
    <div class="name">Devercinge</div>
    <p style="margin-top:8px;"><a href="#" style="color:var(--star); text-decoration:none; border-bottom:1px solid var(--line);">Contact / Instagram</a></p>
  </footer>

<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  const gallery = document.getElementById('gallery');
  const slides = document.querySelectorAll('.slide');
  const dotsContainer = document.getElementById('dots');

  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dotsContainer.appendChild(dot);
  });
  const dots = document.querySelectorAll('.dot');

  gallery.addEventListener('scroll', () => {
    const index = Math.round(gallery.scrollLeft / gallery.clientWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  });
</script>

</body>
</html>
