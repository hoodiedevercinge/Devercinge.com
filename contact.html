<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Devercinge — Contact</title>
<meta name="description" content="Une question, une commande particulière ? Contacte Devercinge directement par e-mail.">
<meta name="theme-color" content="#0a0a0c">
<link rel="canonical" href="https://hoodiedevercinge.github.io/Devercinge.com/contact.html">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devercinge">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Devercinge">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://hoodiedevercinge.github.io/Devercinge.com/contact.html">
<meta property="og:title" content="Devercinge — Contact">
<meta property="og:description" content="Une question, une commande particulière ? Écris-nous, on te répond directement par e‑mail.">
<meta property="og:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Devercinge — Contact">
<meta name="twitter:description" content="Une question, une commande particulière ? Écris-nous, on te répond directement par e‑mail.">
<meta name="twitter:image" content="https://hoodiedevercinge.github.io/Devercinge.com/assets/og-image.jpg">
<style>
  :root{
    --bg: #0a0a0c;
    --card: #131316;
    --ink: #f2f1ef;
    --ink-dim: #9d9ba3;
    --violet: #9b6bff;
    --green: #3ddc84;
    --line: #232227;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse 60% 40% at 12% 8%, rgba(155,107,255,.16), transparent 60%),
      radial-gradient(ellipse 60% 45% at 88% 92%, rgba(61,220,132,.13), transparent 60%),
      var(--bg);
  }

  .brand-mark{
    width:40px;
    height:auto;
    display:block;
    margin:0 auto 14px;
    filter:drop-shadow(0 0 14px rgba(155,107,255,.28));
  }

  .cart-link{
    position:absolute;
    top:calc(20px + env(safe-area-inset-top));
    right:max(20px, env(safe-area-inset-right));
    z-index:2;
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--ink-dim);
    text-decoration:none;
  }
  .cart-link:hover{ color:var(--ink); }
  .cart-link svg{ width:20px; height:20px; display:block; }
  .cart-badge{
    display:none;
    align-items:center;
    justify-content:center;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:999px;
    background:var(--violet);
    color:#0a0a0c;
    font-size:10px;
    font-weight:700;
    line-height:1;
  }

  .stars{
    position:absolute;
    top:0; left:0; right:0;
    height:420px;
    overflow:hidden;
    z-index:0;
  }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:var(--ink);
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.85; } }
  @media (prefers-reduced-motion: reduce){ .stars span{ animation:none; opacity:.4; } }

  header{
    position:relative;
    z-index:1;
    padding:calc(60px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 36px max(24px, env(safe-area-inset-left));
    text-align:center;
  }

  .back-link{
    position:absolute;
    top:calc(20px + env(safe-area-inset-top));
    left:max(20px, env(safe-area-inset-left));
    font-size:12px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    text-decoration:none;
    z-index:2;
  }
  .back-link:hover{ color:var(--ink); }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--violet), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    margin-bottom:14px;
    font-weight:600;
  }
  h1{
    font-family:'Arial Black', 'Segoe UI Black', sans-serif;
    font-size:32px;
    line-height:1.1;
    letter-spacing:-.01em;
    text-transform:uppercase;
  }

  .tagline{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.5;
    padding:0 12px;
  }

  main{ position:relative; z-index:1; padding:0 20px 60px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 22px;
    margin-top:8px;
  }

  .field{ margin-bottom:20px; }
  .field:last-of-type{ margin-bottom:0; }

  .field-label{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
    display:block;
  }

  input, textarea{
    width:100%;
    background:#0f0f12;
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--violet);
  }
  textarea{
    resize:vertical;
    min-height:120px;
    line-height:1.5;
  }

  .cta{
    width:100%;
    margin-top:26px;
    padding:16px;
    border:1px solid rgba(61,150,110,.35);
    border-radius:12px;
    background:#1a3d2c;
    color:var(--ink);
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    overflow:visible;
    box-shadow:0 8px 28px rgba(15,60,40,.55), 0 0 34px rgba(20,80,50,.35);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .cta:active{ transform:scale(.98); }
  .cta:focus-visible{ outline:3px solid var(--violet); outline-offset:2px; }

  .cta::after{
    content:'';
    position:absolute;
    inset:-6px;
    border-radius:16px;
    background:radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(20,90,55,.5), transparent 65%);
    filter:blur(10px);
    opacity:0;
    transition:opacity .3s ease;
    z-index:-1;
  }
  .cta:hover::after{ opacity:1; }

  .note{
    text-align:center;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:10px;
  }

  footer{
    position:relative;
    z-index:1;
    padding:40px max(24px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    text-align:center;
    border-top:1px solid var(--line);
    margin-top:48px;
  }
  footer .name{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  @media (min-width:860px){
    body{ max-width:620px; }
    header{ padding-top:80px; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <header>
    <a href="index.html" class="back-link">← Menu</a>
    <a href="cart.html" class="cart-link" aria-label="Voir le panier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="cart-badge" data-cart-badge>0</span>
    </a>
    <img src="assets/logo-mark.png" alt="" class="brand-mark">
    <div class="eyebrow">Devercinge</div>
    <h1>Contact</h1>
    <p class="tagline">Une question, une commande particulière ? Écris-nous, on te répond directement par e‑mail.</p>
  </header>

  <main>
    <div class="card">
      <div class="field">
        <span class="field-label">Ton nom</span>
        <input type="text" id="fName" placeholder="Prénom / pseudo">
      </div>

      <div class="field">
        <span class="field-label">Ton e‑mail</span>
        <input type="email" id="fEmail" placeholder="ton@mail.com">
      </div>

      <div class="field">
        <span class="field-label">Ton message</span>
        <textarea id="fMessage" placeholder="Écris ta demande ici..."></textarea>
      </div>

      <button class="cta" id="sendBtn">Envoyer</button>
      <p class="note">Ouvre ton application mail pour envoyer directement à hoodiedevercinge@gmail.com</p>
    </div>
  </main>

  <footer>
    <div class="name">Devercinge</div>
  </footer>

<script src="assets/js/cart.js"></script>
<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 50;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    const size = Math.random() * 1.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }

  const cta = document.getElementById('sendBtn');
  cta.addEventListener('pointermove', (e) => {
    const rect = cta.getBoundingClientRect();
    cta.style.setProperty('--x', (e.clientX - rect.left) + 'px');
    cta.style.setProperty('--y', (e.clientY - rect.top) + 'px');
  });

  cta.addEventListener('click', () => {
    const nom = document.getElementById('fName').value || 'Non renseigné';
    const email = document.getElementById('fEmail').value || 'Non renseigné';
    const message = document.getElementById('fMessage').value || '';

    const sujet = encodeURIComponent('Demande depuis le site Devercinge');
    const corps = encodeURIComponent(
      `Nom : ${nom}\nE-mail : ${email}\n\nMessage :\n${message}`
    );
    window.location.href = `mailto:hoodiedevercinge@gmail.com?subject=${sujet}&body=${corps}`;
  });
</script>

</body>
</html>
